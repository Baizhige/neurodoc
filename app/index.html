<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEG Audit Tool</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sidebar-w: 240px;
  --right-w: 340px;
  --step-bar-h: 52px;
  --header-h: 48px;
  --bg: #f5f6f8;
  --panel: #fff;
  --border: #dde1e7;
  --accent: #3b82f6;
  --accent-dark: #1d4ed8;
  --text: #1e2430;
  --muted: #6b7280;
  --green: #10b981;
  --yellow: #f59e0b;
  --red: #ef4444;
  --purple: #8b5cf6;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* Header */
#header { height: var(--header-h); background: var(--text); color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
#header h1 { font-size: 15px; font-weight: 600; }
#header .spacer { flex: 1; }
#btn-settings { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
#btn-settings:hover { background: rgba(255,255,255,0.25); }
#save-status { font-size: 12px; color: rgba(255,255,255,0.6); }

/* Layout */
#layout { display: flex; flex: 1; overflow: hidden; }

/* Left sidebar */
#sidebar { width: var(--sidebar-w); background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
#sidebar-head { padding: 12px; border-bottom: 1px solid var(--border); }
#sidebar-head label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
#filter-category { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
#dataset-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.ds-item { padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; }
.ds-item:hover { background: #f0f4ff; }
.ds-item.active { background: #eff6ff; border-left-color: var(--accent); }
.ds-item.ds-error { cursor: default; opacity: 0.7; }
.ds-item.ds-error:hover { background: #fff1f2; }
.ds-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.ds-cat { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; flex-shrink: 0; }
.badge-wait { background: #fef3c7; color: #92400e; }
.badge-review { background: #dbeafe; color: #1e40af; }
.badge-done { background: #d1fae5; color: #065f46; }
.badge-rev { background: #fee2e2; color: #991b1b; }
.badge-other { background: #e5e7eb; color: #374151; }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#step-bar { height: var(--step-bar-h); background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 4px; flex-shrink: 0; }
.step-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); transition: all .15s; }
.step-btn .step-num { width: 20px; height: 20px; border-radius: 50%; background: #e5e7eb; color: var(--muted); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.step-btn.active { color: var(--accent); background: #eff6ff; }
.step-btn.active .step-num { background: var(--accent); color: #fff; }
.step-btn.done .step-num { background: var(--green); color: #fff; }
.step-sep { color: var(--border); font-size: 18px; }
#step-content { flex: 1; overflow-y: auto; padding: 20px; }
#no-dataset { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 14px; }

/* Bottom action bar */
#action-bar { padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#ds-title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: #e5e7eb; color: var(--text); }
.btn-secondary:hover { background: #d1d5db; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-warning { background: var(--yellow); color: #fff; }
.btn-warning:hover { background: #d97706; }
.btn:disabled { opacity: .5; cursor: default; }

/* Right panel */
#right { width: var(--right-w); background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
#right-tabs { display: flex; border-bottom: 1px solid var(--border); }
.rtab { flex: 1; padding: 10px 6px; border: none; background: none; cursor: pointer; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
.rtab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
#right-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#pane-guide, #pane-rulebook, #pane-chat { display: none; flex-direction: column; flex: 1; overflow: hidden; }
#pane-guide.visible, #pane-rulebook.visible, #pane-chat.visible { display: flex; }

/* Step Guide */
#guide-content { flex: 1; overflow-y: auto; padding: 12px; }
.guide-step-title { font-size: 13px; font-weight: 700; color: var(--accent-dark); margin-bottom: 14px; padding: 8px 10px; background: #eff6ff; border-radius: 6px; border-left: 3px solid var(--accent); }
.guide-section { margin-bottom: 16px; }
.guide-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.guide-section-title .sec-check-count { font-size: 10px; font-weight: 500; color: var(--green); margin-left: auto; }
.guide-check { display: flex; gap: 8px; padding: 5px 6px; border-radius: 5px; margin-bottom: 2px; font-size: 12px; line-height: 1.5; color: var(--text); cursor: pointer; transition: background .1s; border: 1px solid transparent; }
.guide-check:hover { background: #f8fafc; }
.guide-check.checked { background: #f0fdf4; border-color: #bbf7d0; }
.guide-check.highlight-warn { background: #fffbeb; border-color: #fcd34d !important; animation: pulse-warn 1s ease-in-out; }
@keyframes pulse-warn { 0%,100% { border-color: #fcd34d; } 50% { border-color: #f59e0b; } }
.guide-check-box { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all .1s; background: #fff; }
.guide-check.checked .guide-check-box { background: var(--green); border-color: var(--green); }
.guide-check.checked .guide-check-box::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 700; }
.guide-check-num { color: var(--accent); font-weight: 700; min-width: 18px; flex-shrink: 0; }
.guide-check-text { flex: 1; }
.guide-check code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 11px; font-family: monospace; }

/* Rulebook */
#rulebook-search { padding: 10px; border-bottom: 1px solid var(--border); }
#rulebook-search input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
#rulebook-content { flex: 1; overflow-y: auto; padding: 12px; font-size: 12px; line-height: 1.6; }
#rulebook-content h1, #rulebook-content h2 { font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
#rulebook-content h3, #rulebook-content h4 { font-size: 12px; font-weight: 600; margin: 8px 0 4px; }
#rulebook-content p { margin-bottom: 6px; }
#rulebook-content ul, #rulebook-content ol { padding-left: 16px; margin-bottom: 6px; }
#rulebook-content li { margin-bottom: 2px; }
#rulebook-content code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 11px; font-family: monospace; }
#rulebook-content pre { background: #f3f4f6; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 11px; }
#rulebook-content blockquote { border-left: 3px solid var(--border); padding-left: 8px; color: var(--muted); }
#rulebook-content table { border-collapse: collapse; width: 100%; font-size: 11px; }
#rulebook-content th, #rulebook-content td { border: 1px solid var(--border); padding: 4px 6px; }
.rb-step-hint { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 11px; color: var(--accent-dark); }

/* Chat */
#chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.chat-msg { max-width: 90%; }
.chat-msg.user { align-self: flex-end; }
.chat-msg.assistant { align-self: flex-start; }
.chat-bubble { padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
.chat-msg.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
.chat-msg.assistant .chat-bubble { background: #f3f4f6; color: var(--text); border-bottom-left-radius: 2px; }
.chat-bubble p { margin-bottom: 4px; }
.chat-bubble p:last-child { margin-bottom: 0; }
.chat-bubble code { font-size: 11px; background: rgba(0,0,0,0.1); padding: 1px 3px; border-radius: 3px; }
#chat-toolbar { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chat-tool-btn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; color: var(--muted); }
.chat-tool-btn:hover { background: #f3f4f6; color: var(--text); }
.chat-tool-btn.danger:hover { background: #fee2e2; color: var(--red); border-color: var(--red); }
.thinking-block { margin-bottom: 6px; }
.thinking-toggle { font-size: 10px; color: var(--muted); cursor: pointer; background: none; border: none; padding: 0; display: flex; align-items: center; gap: 4px; }
.thinking-toggle:hover { color: var(--accent); }
.thinking-content { font-size: 11px; color: var(--muted); background: #f8fafc; border-left: 2px solid var(--border); padding: 6px 8px; margin-top: 4px; line-height: 1.5; white-space: pre-wrap; display: none; }
.thinking-content.open { display: block; }
#chat-input-area { padding: 10px; border-top: 1px solid var(--border); }
#chat-input-area textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; resize: none; height: 64px; font-family: inherit; }
#chat-context-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }

/* Form */
.section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--muted); }
.form-group input, .form-group select, .form-group textarea { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.form-group textarea { resize: vertical; }
.full-textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: "Consolas","Monaco",monospace; min-height: 200px; resize: vertical; line-height: 1.6; }
.full-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.field-readonly { background: #f3f4f6 !important; color: var(--muted) !important; cursor: not-allowed !important; }
.field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

/* Manual review */
.mr-display { font-size: 13px; color: var(--text); padding: 6px 0; min-height: 24px; }
.mr-display.empty { color: var(--muted); font-style: italic; }
.mr-append-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.mr-append-row input { flex: 1; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.mr-append-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }

/* Bullet list editor */
.bullet-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.bullet-row { display: flex; align-items: flex-start; gap: 6px; }
.bullet-dot { width: 20px; color: var(--muted); font-size: 14px; padding-top: 7px; flex-shrink: 0; text-align: center; }
.bullet-input { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 34px; }
.bullet-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.bullet-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; flex-shrink: 0; line-height: 1; }
.bullet-del:hover { color: var(--red); }
.btn-add-bullet { font-size: 12px; color: var(--accent); background: none; border: 1px dashed var(--accent); border-radius: 4px; padding: 4px 12px; cursor: pointer; }

/* Evidence editor */
.evidence-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; padding: 8px 10px; background: #fafafa; border: 1px solid var(--border); border-radius: 6px; }
.evidence-row-top { display: flex; gap: 6px; align-items: center; }
.evidence-dot { color: var(--muted); font-size: 13px; flex-shrink: 0; }
.evidence-ref { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: monospace; min-width: 0; }
.evidence-ref:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.doi-link { font-size: 13px; flex-shrink: 0; text-decoration: none; transition: color .1s; }
.evidence-desc { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: inherit; box-sizing: border-box; }
.evidence-desc:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }

/* Event table */
.event-table-wrap { overflow-x: auto; margin-bottom: 8px; }
table.event-table { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: fixed; }
table.event-table th { background: #f8fafc; font-weight: 600; text-align: left; padding: 6px 8px; border: 1px solid var(--border); font-size: 11px; }
table.event-table td { padding: 4px; border: 1px solid var(--border); vertical-align: top; }
table.event-table td input, table.event-table td select { width: 100%; border: none; background: transparent; font-size: 12px; padding: 3px 4px; font-family: inherit; }
table.event-table td input:focus, table.event-table td select:focus { outline: 1px solid var(--accent); border-radius: 3px; }
table.event-table tr:hover td { background: #f9fafb; }
/* Meaning textarea in event table */
table.event-table td textarea.meaning-cell { width: 100%; border: none; background: transparent; font-size: 12px; padding: 3px 4px; font-family: inherit; resize: none; overflow: hidden; line-height: 1.5; min-height: 26px; display: block; }
table.event-table td textarea.meaning-cell:focus { outline: 1px solid var(--accent); border-radius: 3px; }
.btn-row-add { font-size: 11px; color: var(--accent); background: none; border: 1px dashed var(--accent); border-radius: 4px; padding: 4px 10px; cursor: pointer; margin-top: 4px; }
.btn-row-del { color: var(--red); background: none; border: none; cursor: pointer; padding: 2px 6px; font-size: 14px; }

/* Tabs */
.tab-strip { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab-opt { padding: 7px 14px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab-opt.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* Preview wrap */
.preview-wrap { background: #fafafa; border: 1px solid var(--border); border-radius: 6px; padding: 14px; font-size: 13px; line-height: 1.7; }
.preview-wrap h1 { font-size: 16px; margin-bottom: 8px; }
.preview-wrap h2 { font-size: 14px; margin: 12px 0 6px; }
.preview-wrap h3 { font-size: 13px; margin: 8px 0 4px; }
.preview-wrap table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.preview-wrap th, .preview-wrap td { border: 1px solid var(--border); padding: 5px 8px; font-size: 12px; }
.preview-wrap code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-family: monospace; }
.preview-wrap blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); margin: 6px 0; }

/* KR */
.kr-field { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.kr-field label { font-size: 13px; font-weight: 600; min-width: 160px; padding-top: 2px; }
.toggle-group { display: flex; gap: 0; }
.toggle-opt { padding: 6px 16px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; transition: all .1s; }
.toggle-opt:first-child { border-radius: 6px 0 0 6px; }
.toggle-opt:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.toggle-opt.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.status-select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

/* Doc error banner */
.doc-error-banner { background: #fee2e2; border: 1px solid var(--red); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.doc-error-banner h3 { font-size: 13px; font-weight: 700; color: #991b1b; margin-bottom: 8px; }
.doc-error-banner ul { padding-left: 16px; margin: 0; }
.doc-error-banner li { font-size: 12px; color: #991b1b; margin-bottom: 3px; }

/* Task cards */
.task-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.task-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.task-kind-group { display: flex; gap: 0; }
.task-kind-btn { padding: 4px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; transition: all .1s; }
.task-kind-btn:first-child { border-radius: 4px 0 0 4px; }
.task-kind-btn:last-child { border-radius: 0 4px 4px 0; border-left: none; }
.task-kind-btn.selected-classical { background: var(--accent); color: #fff; border-color: var(--accent); }
.task-kind-btn.selected-potential { background: var(--purple); color: #fff; border-color: var(--purple); }
.task-name-input { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
.task-name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.btn-del-task { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; color: var(--red); font-size: 16px; line-height: 1; }
.btn-del-task:hover { background: #fee2e2; }
.task-fields-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.task-field { display: flex; flex-direction: column; gap: 3px; }
.task-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.task-field select, .task-field input[type=text] { padding: 5px 7px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: inherit; background: #fff; }
.task-field select:focus, .task-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }

/* Epoch params */
.epoch-params-block { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
.epoch-params-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }
.epoch-required-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.epoch-field { display: flex; flex-direction: column; gap: 3px; }
.epoch-field label { font-size: 11px; font-weight: 600; color: var(--text); }
.epoch-field .req-mark { color: var(--red); font-size: 11px; }
.epoch-field input { padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: monospace; width: 100px; }
.epoch-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.epoch-field .unit { font-size: 11px; color: var(--muted); }
.epoch-custom-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; margin-top: 4px; }
.epoch-custom-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.epoch-custom-row input { padding: 4px 7px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-family: monospace; }
.epoch-custom-row input:focus { outline: none; border-color: var(--accent); }
.epoch-custom-key { width: 110px; }
.epoch-custom-val { flex: 1; }
.epoch-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

/* Target definition */
.task-td-section { margin-bottom: 10px; }
.task-td-section > label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 6px; }
.td-table { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 4px; }
.td-table th { background: #f8fafc; font-weight: 600; text-align: left; padding: 5px 7px; border: 1px solid var(--border); font-size: 11px; }
.td-table td { padding: 3px; border: 1px solid var(--border); }
.td-table td input { width: 100%; border: none; background: transparent; font-size: 12px; padding: 3px 4px; font-family: inherit; }
.td-table td input:focus { outline: 1px solid var(--accent); border-radius: 3px; }
.td-table tr:hover td { background: #f9fafb; }
.misc-channel-wrap { display: flex; flex-direction: column; gap: 6px; }
.misc-channel-wrap input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: monospace; }
.misc-channel-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.misc-warning { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 5px; padding: 6px 10px; font-size: 11px; color: #92400e; }
.task-text-field { margin-bottom: 10px; }
.task-text-field > label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 6px; }
.add-task-row { display: flex; gap: 8px; margin-bottom: 16px; }

/* Modals */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
#modal { background: #fff; border-radius: 10px; padding: 24px; width: 420px; max-width: 90vw; }
#modal h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
#modal .form-group { margin-bottom: 14px; }
#modal .form-group label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 5px; }
#modal .form-group input { width: 100%; }
#modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

/* Error modal */
#err-modal { background: #fff; border-radius: 10px; padding: 24px; width: 480px; max-width: 90vw; }
#err-modal h2 { font-size: 14px; font-weight: 700; color: #991b1b; margin-bottom: 12px; }
#err-modal ul { padding-left: 18px; margin-bottom: 14px; }
#err-modal li { font-size: 13px; margin-bottom: 4px; }
#err-modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

/* Preview modal */
#preview-modal { background: #fff; border-radius: 10px; padding: 0; width: 860px; max-width: 96vw; max-height: 92vh; display: flex; flex-direction: column; }
#preview-modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
#preview-modal-header h2 { font-size: 15px; font-weight: 700; flex: 1; }
#preview-modal-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
#preview-modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
#preview-markdown { font-size: 13px; line-height: 1.7; }
#preview-markdown h1 { font-size: 18px; margin-bottom: 10px; }
#preview-markdown h2 { font-size: 15px; font-weight: 700; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--border); }
#preview-markdown h3 { font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
#preview-markdown ul, #preview-markdown ol { padding-left: 20px; margin: 6px 0; }
#preview-markdown li { margin-bottom: 3px; }
#preview-markdown table { border-collapse: collapse; width: 100%; margin: 8px 0; }
#preview-markdown th, #preview-markdown td { border: 1px solid var(--border); padding: 5px 8px; font-size: 12px; }
#preview-markdown code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-family: monospace; }
#preview-markdown blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); margin: 8px 0; }
</style>
</head>
<body>

<div id="header">
  <h1>EEG Audit Tool</h1>
  <div class="spacer"></div>
  <span id="save-status"></span>
  <button id="btn-settings" onclick="openSettings()">&#9881; Settings</button>
</div>

<div id="layout">
  <div id="sidebar">
    <div id="sidebar-head">
      <label>Filter by Category</label>
      <select id="filter-category" onchange="renderDatasetList()">
        <option value="">All Categories</option>
      </select>
    </div>
    <div id="dataset-list"></div>
  </div>

  <div id="main">
    <div id="step-bar">
      <button class="step-btn active" id="step-btn-0" onclick="goStep(0)"><span class="step-num">1</span> Meta-Paradigm</button>
      <span class="step-sep">›</span>
      <button class="step-btn" id="step-btn-1" onclick="goStep(1)"><span class="step-num">2</span> File Scan &amp; Tasks</button>
      <span class="step-sep">›</span>
      <button class="step-btn" id="step-btn-2" onclick="goStep(2)"><span class="step-num">3</span> DQN &amp; Kernel</button>
    </div>
    <div id="step-content">
      <div id="no-dataset">&#8592; Select a dataset to start reviewing</div>
    </div>
    <div id="action-bar" style="display:none">
      <span id="ds-title"></span>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="btn-prev" onclick="prevStep()" disabled>&#8592; Prev</button>
      <button class="btn btn-secondary" id="btn-next" onclick="nextStep()">Next &#8594;</button>
      <button class="btn btn-warning" id="btn-preview" onclick="confirmAndPreview()" style="display:none">&#128065; Confirm &amp; Preview</button>
      <button class="btn btn-success" id="btn-save" onclick="saveFile()">&#128190; Save File</button>
    </div>
  </div>

  <div id="right">
    <div id="right-tabs">
      <button class="rtab active" id="rtab-guide" onclick="switchRightTab('guide')">Step Guide</button>
      <button class="rtab" id="rtab-rulebook" onclick="switchRightTab('rulebook')">Rulebook</button>
      <button class="rtab" id="rtab-chat" onclick="switchRightTab('chat')">LLM Chat</button>
    </div>
    <div id="right-body">
      <div id="pane-guide" class="visible">
        <div id="guide-content"><p style="color:var(--muted);font-size:12px;padding:12px">Select a dataset to begin.</p></div>
      </div>
      <div id="pane-rulebook">
        <div id="rulebook-search">
          <input type="text" id="rb-search" placeholder="Search rulebook..." oninput="filterRulebook()">
        </div>
        <div id="rulebook-content">Loading rulebook&#8230;</div>
      </div>
      <div id="pane-chat">
        <div id="chat-toolbar">
          <button class="chat-tool-btn danger" onclick="clearChat()" title="Clear all messages and history">🗑 Clear</button>
          <button class="chat-tool-btn" onclick="compressChat()" title="Summarize history into one context message">⚡ Compress</button>
          <span id="chat-token-hint" style="font-size:10px;color:var(--muted);margin-left:auto;align-self:center"></span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <div id="chat-context-label">Context: —</div>
          <textarea id="chat-input" placeholder="Ask about this dataset or rules&#8230;" onkeydown="chatKeydown(event)"></textarea>
          <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div id="modal-overlay" class="modal-overlay">
  <div id="modal">
    <h2>LLM Settings</h2>
    <div class="form-group"><label>API Base URL</label><input type="text" id="cfg-url" placeholder="https://api.minimax.io/v1"></div>
    <div class="form-group"><label>API Key</label><input type="password" id="cfg-key" placeholder="sk-..."></div>
    <div class="form-group"><label>Model</label><input type="text" id="cfg-model" placeholder="MiniMax-M2.7"></div>
    <div class="form-group"><label>Proxy (optional, e.g. http://localhost:7897)</label><input type="text" id="cfg-proxy" placeholder="Leave empty if not needed"></div>
    <div id="modal-actions">
      <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Error modal -->
<div id="err-modal-overlay" class="modal-overlay">
  <div id="err-modal">
    <h2>&#9888; Document Structural Errors</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">This document cannot be audited until structural errors are fixed. Edit the raw <code>analysis.md</code> directly.</p>
    <ul id="err-modal-list"></ul>
    <div id="err-modal-actions">
      <button class="btn btn-secondary" onclick="closeErrModal()">Close</button>
      <button class="btn btn-primary" onclick="viewRawContent()">View Raw</button>
    </div>
  </div>
</div>

<!-- Preview modal -->
<div id="preview-modal-overlay" class="modal-overlay">
  <div id="preview-modal">
    <div id="preview-modal-header">
      <h2>&#128065; Document Preview</h2>
      <button class="btn btn-secondary" onclick="closePreview()">Close</button>
      <button class="btn btn-success" onclick="saveFromPreview()">&#128190; Save File</button>
    </div>
    <div id="preview-modal-body">
      <div id="preview-markdown"></div>
    </div>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const STEP_LABELS = ['Meta-Paradigm', 'File Scan & Tasks', 'DQN & Kernel'];

const STEP_RULEBOOK_HINTS = [
  '第22条 Dataset, 第25条 Category, 第30条 Manual Review, 第31条 Paradigm',
  '第七章 File Scan, Event Structure, MISC, Info, 第九章 Tasks, Label Route, Target',
  '第十一章 Data Quality, 第37条 Super Meta Required, 第42条 Status',
];

const VALID_CATEGORIES = ['Complex Applied','High-level Mental','Action/Output','Sensory/Response','Biological State','Others'];
const EPOCH_METHODS = ['epoch_by_event_hdf5','epoch_by_long_event_hdf5','epoch_by_segmentation_hdf5'];
const LABEL_ROUTES = ['event','misc','info'];
const REQUIRED_SECTIONS = ['Paradigm','File Scan Result','Tasks','Data Quality Notes','Kernel Responsibilities'];
const FORBIDDEN_SECTIONS = ['STIM Label Summary'];

// Step guide content (flat items per step, sections for grouping)
const STEP_GUIDE = [
  {
    title: 'Step 1: Meta-Paradigm',
    sections: [
      {
        heading: 'Meta Fields',
        items: [
          { key: 's0-1', text: 'Verify <strong>URL</strong> — open the link; confirm it is accessible and points to the dataset info page (not a raw file download).' },
          { key: 's0-0', text: 'Verify <strong>Year</strong> — cross-check with the official source or the earliest relevant paper.' },
          { key: 's0-2', text: 'Verify <strong>Category</strong> — must be one of 6 valid values. Correct only if clearly wrong.' },
          { key: 's0-3', text: 'Verify <strong>Subjects</strong> — use actual usable count, not the advertised number. Note discrepancies in DQN.' },
          { key: 's0-5', text: 'Verify <strong>Channels</strong> — matches data files. Use <code>Variable</code> if complex.' },
          { key: 's0-6', text: 'Verify <strong>Sampling Rate</strong> — matches data. Use <code>Variable</code> if differs across files.' },
          { key: 's0-7', text: 'Add your name to <strong>Manual Review</strong> (append only).' },
        ]
      },
      {
        heading: 'Paradigm',
        items: [
          { key: 's0-8', text: 'Read the paradigm description in full, then cross-check with the official dataset page or README — are they consistent?' },
          { key: 's0-9', text: 'Check consistency with the data directory and file structure — if online information is sufficient (e.g. OpenNeuro page, official README), local inspection can be skipped.' },
        ]
      }
    ]
  },
  {
    title: 'Step 2: File Scan & Tasks',
    sections: [
      {
        heading: 'Event Structure',
        items: [
          { key: 's1-1', text: 'Check <strong>Type</strong> for each row — <code>event</code> (task-relevant signal) or <code>admin</code> (boundary / artifact marker)? If wrong, correct it via the dropdown.' },
          { key: 's1-2', text: 'Check <strong>Meaning</strong> for each row — is the description accurate and unambiguous? Edit directly if needed.' },
          { key: 's1-note', text: 'Check the <strong>Notes (blockquote)</strong> below the table — are there events that the scanner missed but you know exist? If so, add a pointer to where the information can be found (e.g. README section, companion file, paper Table 1). Do <em>not</em> manually enumerate all values — just say where to look.' },
        ]
      },
      {
        heading: 'Info',
        items: [
          { key: 's1-3', text: 'The <strong>Notes</strong> column is for flagging missing or incorrect entries, and for pointing to where correct information can be found. You do <em>not</em> need to manually fill in age ranges or sex breakdowns. For <code>device</code>: if the amplifier/hardware model is mentioned in the dataset page or README, write the model name in the Notes column — this is the one field the scanner cannot reliably detect.' },
        ]
      },
      {
        heading: 'Tasks — A: Understand & Verify References',
        items: [
          { key: 's1-4', text: '<strong>Classical Task</strong>: First understand the task\'s scientific meaning. Then review Evidence (keep at most 3 references): does each reference describe the <strong style="color:var(--red)">same dataset</strong> and the <strong style="color:var(--red)">same task</strong>? Delete irrelevant references. If <em>no valid reference remains</em>, delete the task entirely.' },
          { key: 's1-5', text: '<strong>Potential Task</strong>: No Evidence required. Evaluate feasibility from File Scan results and your own experience — proceed directly to step B.' },
        ]
      },
      {
        heading: 'Tasks — B: Epoch Method & Parameters',
        items: [
          { key: 's1-6', text: 'Is the <strong>Epoch Method</strong> appropriate? Event-locked (<code>epoch_by_event_hdf5</code>) for discrete cues; continuous segmentation (<code>epoch_by_continuous_hdf5</code>) for resting-state or long recordings.' },
          { key: 's1-7', text: 'Are <strong>Epoch Parameters</strong> consistent with your selected reference(s)? If multiple references report different windows, choose the most representative or a reasonable compromise, and note the rationale in Kernel Notes.' },
        ]
      },
      {
        heading: 'Tasks — C: Target Definition',
        items: [
          { key: 's1-8', text: 'Is the <strong>Target Definition</strong> complete — all relevant events/channels covered, y-values correctly assigned, consistent with Label Route (<code>event</code> / <code>misc</code> / <code>info</code>)?' },
        ]
      },
      {
        heading: 'Tasks — D: No Tasks Remaining',
        items: [
          { key: 's1-9', text: 'If all tasks were deleted after reference review: go back and check the removed references — do any of them describe a <em>different valid task</em> on this dataset? If yes, add a new task and repeat steps A → C.' },
        ]
      },
    ]
  },
  {
    title: 'Step 3: DQN & Kernel',
    sections: [
      {
        heading: 'Data Quality Notes',
        items: [
          { key: 's2-0', text: 'Read through the existing Data Quality Notes — are they accurate and complete?' },
          { key: 's2-1', text: 'Do you need to add any new notes? Consider: missing or corrupted files, channel substitutions or renamed channels, special preprocessing requirements, known artifacts, label inconsistencies, subject count discrepancies, multi-session quirks, etc.' },
        ]
      },
      {
        heading: 'Kernel Responsibilities',
        items: [
          { key: 's2-2', text: '<strong>Super Meta Required</strong>: check Step 2 Tasks — if any task has Meta Level = super, select Yes; otherwise No.' },
          { key: 's2-3', text: '<strong>Status</strong>: as the reviewer, your final choice must be <code>completed</code> (review done, issues documented) or <code>hallucination</code> (entire document fundamentally unreliable, cannot be fixed). Do not leave it as <code>wait_manual_review</code> or <code>wait_kernel_update</code> after you finish.' },
        ]
      }
    ]
  }
];

// ─── State ────────────────────────────────────────────────────────────────────
let allDatasets = [];
let currentDataset = null;
let rawContent = '';
let currentStep = 0;
let rulebookRaw = '';
let llmHistory = [];
let dirty = false;
let currentTasks = [];
let pendingErrDataset = null;
let guideChecks = {};   // key → boolean
let previewSeen = false;

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadDatasets(), loadRulebook(), loadConfig()]);
  validateAllDatasets();
}

async function loadDatasets() {
  try {
    const r = await fetch('/api/datasets');
    allDatasets = await r.json();
    populateCategoryFilter();
    renderDatasetList();
  } catch(e) {}
}

async function validateAllDatasets() {
  for (const ds of allDatasets) {
    try {
      const r = await fetch(`/api/dataset/${encodeURIComponent(ds.name)}`);
      const d = await r.json();
      const errors = validateDocument(d.content);
      if (errors.length) { ds._errors = errors; renderDatasetList(); }
    } catch(e) {}
    await new Promise(res => setTimeout(res, 80));
  }
}

async function loadRulebook() {
  try {
    const r = await fetch('/api/rulebook');
    const d = await r.json();
    rulebookRaw = d.content;
    renderRulebook();
  } catch(e) {}
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    document.getElementById('cfg-url').value = cfg.url || '';
    document.getElementById('cfg-key').value = cfg.key || '';
    document.getElementById('cfg-model').value = cfg.model || '';
    document.getElementById('cfg-proxy').value = cfg.proxy || '';
  } catch(e) {}
}

// ─── Document Validation ──────────────────────────────────────────────────────
function validateDocument(raw) {
  const errors = [];
  REQUIRED_SECTIONS.forEach(sec => {
    if (!new RegExp(`\\n## ${escRe(sec)}\\s*(\\n|$)`).test('\n' + raw))
      errors.push(`Missing required section: ## ${sec}`);
  });
  const allSecs = [...raw.matchAll(/\n## ([^\n]+)/g)].map(m => m[1].trim());
  FORBIDDEN_SECTIONS.forEach(f => {
    if (allSecs.some(s => s.includes(f)))
      errors.push(`Forbidden/deprecated section: ## ${allSecs.find(s => s.includes(f))}`);
  });
  allSecs.forEach(sec => {
    if (!REQUIRED_SECTIONS.includes(sec) && !FORBIDDEN_SECTIONS.some(f => sec.includes(f)))
      errors.push(`Unexpected section: ## ${sec}`);
  });
  return errors;
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function populateCategoryFilter() {
  const cats = [...new Set(allDatasets.map(d => d.category))].sort();
  const sel = document.getElementById('filter-category');
  sel.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
}

function renderDatasetList() {
  const cat = document.getElementById('filter-category').value;
  const filtered = cat ? allDatasets.filter(d => d.category === cat) : allDatasets;
  const list = document.getElementById('dataset-list');
  list.innerHTML = '';
  filtered.forEach(d => {
    const hasErr = d._errors && d._errors.length > 0;
    const div = document.createElement('div');
    div.className = 'ds-item' + (currentDataset === d.name ? ' active' : '') + (hasErr ? ' ds-error' : '');
    div.onclick = () => hasErr ? showErrModal(d) : selectDataset(d.name);
    div.innerHTML = `<div class="ds-name">${esc(d.name)}</div>
      <div class="ds-meta"><span class="ds-cat">${esc(d.category)}</span>
      <span class="badge ${hasErr ? 'badge-rev' : statusBadgeClass(d.status)}">${hasErr ? 'error' : esc(d.status)}</span></div>`;
    list.appendChild(div);
  });
}

function statusBadgeClass(s) {
  if (!s || s === 'unknown') return 'badge-other';
  if (s === 'wait_kernel_update') return 'badge-wait';
  if (s === 'wait_manual_review') return 'badge-review';
  if (s === 'completed') return 'badge-done';
  if (s === 'hallucination') return 'badge-rev';
  if (s.includes('wait')) return 'badge-wait';
  if (s.includes('review')) return 'badge-review';
  return 'badge-other';
}

function showErrModal(ds) {
  pendingErrDataset = ds.name;
  document.getElementById('err-modal-list').innerHTML = ds._errors.map(e => `<li>${esc(e)}</li>`).join('');
  document.getElementById('err-modal-overlay').classList.add('open');
}
function closeErrModal() { document.getElementById('err-modal-overlay').classList.remove('open'); pendingErrDataset = null; }
async function viewRawContent() {
  if (!pendingErrDataset) return;
  closeErrModal();
  try {
    const r = await fetch(`/api/dataset/${encodeURIComponent(pendingErrDataset)}`);
    const d = await r.json();
    document.getElementById('action-bar').style.display = 'none';
    const ds = allDatasets.find(x => x.name === pendingErrDataset);
    document.getElementById('step-content').innerHTML = `
      <div class="doc-error-banner"><h3>&#9888; Document has structural errors — read-only</h3>
        <ul>${ds?._errors?.map(e=>`<li>${esc(e)}</li>`).join('')||''}</ul></div>
      <textarea class="full-textarea" style="min-height:500px" readonly>${esc(d.content)}</textarea>`;
  } catch(e) {}
}
document.getElementById('err-modal-overlay').onclick = function(e) { if (e.target===this) closeErrModal(); };

async function selectDataset(name) {
  if (dirty && !confirm('Unsaved changes — discard and switch?')) return;
  currentDataset = name; dirty = false; currentStep = 0; previewSeen = false;
  try {
    const r = await fetch(`/api/dataset/${encodeURIComponent(name)}`);
    const d = await r.json();
    rawContent = d.content;
  } catch(e) { alert('Failed to load dataset'); return; }
  const errors = validateDocument(rawContent);
  const ds = allDatasets.find(d => d.name === name);
  if (ds) ds._errors = errors.length ? errors : undefined;
  renderDatasetList();
  if (errors.length) { showErrModal(ds || { name, _errors: errors }); return; }
  llmHistory = [];
  document.getElementById('action-bar').style.display = 'flex';
  document.getElementById('ds-title').textContent = name;
  renderStep(0);
  updateStepBar();
}

// ─── Step Navigation ──────────────────────────────────────────────────────────
function goStep(idx) { collectStep(currentStep); currentStep = idx; renderStep(idx); updateStepBar(); }
function prevStep() { if (currentStep===0) return; collectStep(currentStep); currentStep--; renderStep(currentStep); updateStepBar(); }
function nextStep() { if (currentStep===2) return; collectStep(currentStep); currentStep++; renderStep(currentStep); updateStepBar(); }

function updateStepBar() {
  for (let i=0;i<3;i++) {
    const btn = document.getElementById(`step-btn-${i}`);
    btn.classList.toggle('active', i===currentStep);
  }
  document.getElementById('btn-prev').disabled = currentStep===0;
  document.getElementById('btn-next').disabled = currentStep===2;
  document.getElementById('btn-preview').style.display = currentStep===2 ? '' : 'none';
  renderRulebook(); renderStepGuide();
  document.getElementById('chat-context-label').textContent =
    `Context: ${currentDataset} — step ${currentStep+1}: ${STEP_LABELS[currentStep]} | full doc + rulebook injected`;
  updateChatTokenHint();
}

// ─── Parsing Helpers ──────────────────────────────────────────────────────────
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function getSection(raw, h) {
  const re = new RegExp(`\\n## ${escRe(h)}\\s*\\n([\\s\\S]*?)(?=\\n## |$)`);
  const m = raw.match(re); return m ? m[1].trim() : '';
}
function replaceSection(raw, h, body) {
  const re = new RegExp(`(\\n## ${escRe(h)}\\s*\\n)[\\s\\S]*?(?=\\n## |$)`);
  const rep = `\n## ${h}\n\n${body}\n`;
  return re.test(raw) ? raw.replace(re, rep) : raw.trimEnd() + `\n\n## ${h}\n\n${body}\n`;
}
function getSubSection(body, h) {
  const re = new RegExp(`###\\s+${escRe(h)}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`);
  const m = body.match(re); return m ? m[1].trim() : '';
}
function parseMeta(raw) {
  const f = {};
  const l1 = raw.match(/\*\*Dataset\*\*[^\n]+/);
  if (l1) l1[0].split('|').forEach(p => { const m=p.match(/\*\*([^*]+)\*\*:\s*`?([^`|*\n]+)`?/); if(m) f[m[1].trim()]=m[2].trim(); });
  const l2 = raw.match(/\*\*Category\*\*[^\n]+/);
  if (l2) l2[0].split('|').forEach(p => { const m=p.match(/\*\*([^*]+)\*\*:\s*`?([^`|*\n]+)`?/); if(m) f[m[1].trim()]=m[2].trim(); });
  const tm = raw.match(/^#\s+(.+)/m); f['_title'] = tm ? tm[1].trim() : '';
  const mrm = raw.match(/\*\*Manual Review\*\*:\s*([^\n]+)/); f['_manualReview'] = mrm ? mrm[1].trim() : '';
  return f;
}
function serializeMeta(f) {
  return `**Dataset**: \`${f['Dataset']||''}\` | **Year**: ${f['Year']||''} | **URL**: ${f['URL']||''}\n**Category**: ${f['Category']||''} | **Subjects**: ${f['Subjects']||''} | **Files (Completed)**: ${f['Files (Completed)']||''} | **Channels**: ${f['Channels']||''} | **Sampling Rate**: ${f['Sampling Rate']||''}`;
}
function parseMarkdownTable(text) {
  const lines = text.split('\n').filter(l => l.trim().startsWith('|'));
  if (lines.length < 2) return { headers:[], rows:[] };
  const headers = lines[0].split('|').map(c=>c.trim()).filter(Boolean);
  const rows = [];
  for (let i=2;i<lines.length;i++) { const c=lines[i].split('|').map(c=>c.trim()).filter(Boolean); if(c.length) rows.push(c); }
  return { headers, rows };
}

// ─── Evidence Helpers ─────────────────────────────────────────────────────────
function parseEvidence(text) {

  text.split('\n').forEach(line => {

    if (!l) return;
    // Match "DOI: ref — desc" or "ref — desc"
    const m = l.match(/^(?:DOI:\s*)?([^\s—–-][^—–]*?)\s*[—–-]{1,2}\s*(.+)$/);
    if (m) items.push({ ref: m[1].trim(), desc: m[2].trim() });
    else items.push({ ref: l, desc: '' });
  });
  return items;
}
function doiLink(ref) {
  const v = ref.trim();
  const isDoi = /^10\.\d{4,}\//.test(v);
  if (isDoi) return `<a href="https://doi.org/${encodeURIComponent(v)}" target="_blank" class="doi-link" style="color:var(--accent)" title="Open DOI">↗</a>`;
  return `<span class="doi-link" style="color:var(--border);cursor:default">↗</span>`;
}
function buildEvidenceEditor(id, items) {

  ).join('');
  return `<div id="${id}-list">${rows}</div>

}
function addEvidenceRow(id) {

function updateDoiLink(input) {
  const link = input.nextElementSibling;
  if (!link) return;
  const v = input.value.trim();
  const isDoi = /^10\.\d{4,}\//.test(v);
  if (isDoi) {
    link.outerHTML = `<a href="https://doi.org/${encodeURIComponent(v)}" target="_blank" class="doi-link" style="color:var(--accent)" title="Open DOI">↗</a>`;
  } else {
    // check if it's currently an anchor
    if (link.tagName === 'A') link.outerHTML = `<span class="doi-link" style="color:var(--border);cursor:default">↗</span>`;
    else { link.style.color = 'var(--border)'; }
  }
}

// ─── Epoch Params Helpers ─────────────────────────────────────────────────────
function parseEpochParams(epLine, method) {
  const get = (key) => {
    const m = epLine.match(new RegExp(`${escRe(key)}\\s*=\\s*([^,*\\]\\n]+)`));
    return m ? m[1].replace(/\s*s\s*$/, '').replace(/\*/g, '').trim() : '';
  };
  const result = { tmin:'', tmax:'', overlap:'', segment_length:'', custom:[] };
  result.tmin = get('tmin');
  result.tmax = get('tmax');
  result.overlap = get('overlap');
  result.segment_length = get('segment_length');
  // Extract custom params: any key=value not in required set
  const required = new Set(['tmin','tmax','overlap','segment_length','target_events']);
  const allPairs = [...epLine.matchAll(/(\w+)\s*=\s*([^,\n\]]+)/g)];
  allPairs.forEach(m => {
    const k = m[1].trim();
    if (!required.has(k)) result.custom.push({ key: k, val: m[2].replace(/\*/g,'').trim() });
  });
  return result;
}

function collectEpochParams(card, idx, method) {
  const block = card.querySelector(`#ep-block-${idx}`);
  if (!block) return '';
  const isEvent = method === 'epoch_by_event_hdf5';
  const isLong = method === 'epoch_by_long_event_hdf5';
  const isSeg = method === 'epoch_by_segmentation_hdf5';
  const parts = [];
  if (isEvent || isLong) {
    const tmin = block.querySelector('.ep-tmin')?.value.trim() || '';
    const tmax = block.querySelector('.ep-tmax')?.value.trim() || '';
    if (tmin) parts.push(`tmin = ${tmin} s`);
    if (tmax) parts.push(`tmax = ${tmax} s`);
    if (isLong) {
      const overlap = block.querySelector('.ep-overlap')?.value.trim() || '';
      if (overlap) parts.push(`overlap = ${overlap}`);
    }
  } else if (isSeg) {
    const sl = block.querySelector('.ep-seg-len')?.value.trim() || '';
    const ov = block.querySelector('.ep-overlap')?.value.trim() || '';
    if (sl) parts.push(`segment_length = ${sl} s`);
    if (ov) parts.push(`overlap = ${ov}`);
  }
  block.querySelectorAll(`#ep-custom-${idx} .epoch-custom-row`).forEach(row => {
    const k = row.querySelector('.epoch-custom-key')?.value.trim();
    const v = row.querySelector('.epoch-custom-val')?.value.trim();
    if (k && v) parts.push(`${k} = ${v}`);
  });
  return parts.join(', ');
}

  const { headers, rows } = parseMarkdownTable(esBody);
  const hdrs = headers.length ? headers : ['Event ID','Count (total)','Type','Meta Level','Meaning'];
  // Col widths: Event ID 22%, Count 10%, Type 9%, Meta 9%, Meaning 50%
  const colWidths = { 'event id': '22%', 'count': '10%', 'type': '9%', 'meta': '9%', 'meaning': '50%' };
  const colgroup = hdrs.map(h => {
    const key = Object.keys(colWidths).find(k => h.toLowerCase().includes(k));
    return `<col style="width:${key ? colWidths[key] : 'auto'}">`;
  }).join('');
  let html = `<table class="event-table" id="event-table"><colgroup>${colgroup}</colgroup><thead><tr>${hdrs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody id="event-tbody">`;
  (rows.length ? rows : [['','','event','raw','']]).forEach(row => { html += buildEventRow(row, hdrs); });
  return html + '</tbody></table>';
}
function buildEventRow(cells, headers) {
  const ti = headers.findIndex(h=>h.toLowerCase()==='type');
  const meanI = headers.findIndex(h=>h.toLowerCase().includes('meaning'));
  let html = '<tr>';
  headers.forEach((h,ci) => {
    const v = (cells[ci]||'').replace(/^`|`$/g,'');
    if (ci===ti) {
      html += `<td><select><option ${v==='event'?'selected':''}>event</option><option ${v==='admin'?'selected':''}>admin</option></select></td>`;
    } else if (ci===meanI) {
      html += `<td><textarea class="meaning-cell" rows="1" oninput="autoResize(this)">${esc(v)}</textarea></td>`;
    } else {
      html += `<td><input type="text" value="${esc(v)}" class="field-readonly" readonly tabindex="-1"></td>`;
    }
  });
  return html + '</tr>';
}

function buildInfoTableEditor(infoBody) {
  const { headers, rows } = parseMarkdownTable(infoBody);
  const hdrs = headers.length ? headers : ['Field','Completeness','Notes'];
  const COMP = ['complete','partial','incomplete','missing'];
  let html = `<table class="event-table" id="info-table"><thead><tr>${hdrs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  (rows.length ? rows : [['subject_age','missing','N/A'],['subject_sex','missing','N/A'],['device','missing','N/A']]).forEach(row => {
    const field=(row[0]||'').replace(/^`|`$/g,''), comp=row[1]||'missing', notes=row[2]||'N/A';
    const COMP_OPTS = COMP.map(c=>`<option ${comp===c?'selected':''}>${c}</option>`).join('');
    // All rows: Field + Completeness readonly, Notes editable
    html += `<tr>
      <td style="width:130px"><input type="text" value="${esc(field)}" class="field-readonly" readonly tabindex="-1"></td>
      <td style="width:110px"><input type="text" value="${esc(comp)}" class="field-readonly" readonly tabindex="-1"></td>
      <td><input type="text" value="${esc(notes)}" placeholder="${field==='device'?'e.g. BrainProducts actiCAP 64ch':''}"></td>
    </tr>`;
  });
  return html + '</tbody></table>';
}
function serializeEventTable() {
  const table = document.getElementById('event-table'); if (!table) return '';
  const headers = [...table.querySelectorAll('thead th')].map(th=>th.textContent).filter(t=>t!=='');
  let md = '| '+headers.join(' | ')+' |\n|'+headers.map(()=>'---').join('|')+'|\n';
  table.querySelectorAll('tbody tr').forEach(tr => {
    const cells=[...tr.querySelectorAll('td')].slice(0,headers.length);
    const vals=cells.map((td,i)=>{ const ta=td.querySelector('textarea'); const inp=td.querySelector('input'); const sel=td.querySelector('select'); if(ta) return ta.value.trim(); if(inp) return inp.value.trim(); if(sel) return sel.value; return ''; });
    if (vals.some(v=>v)) md+='| '+vals.map((v,i)=>i===0&&v&&!v.startsWith('`')?`\`${v}\``:v).join(' | ')+' |\n';
  });
  return md;
}
function serializeInfoTable() {
  const table = document.getElementById('info-table'); if (!table) return '';
  const headers = [...table.querySelectorAll('thead th')].map(th=>th.textContent);
  let md = '| '+headers.join(' | ')+' |\n|'+headers.map(()=>'---').join('|')+'|\n';
  table.querySelectorAll('tbody tr').forEach(tr => {
    const cells=[...tr.querySelectorAll('td')];
    const vals=cells.map(td=>{ const i=td.querySelector('input'); const s=td.querySelector('select'); if(i) return i.value.trim(); if(s) return s.value; return ''; });
    if (vals[0]) md+=`| \`${vals[0]}\` | ${vals[1]} | ${vals[2]||'N/A'} |\n`;
  });
  return md;
}

// ─── MISC Validation ──────────────────────────────────────────────────────────
function getMiscChannels() {
  const body = document.getElementById('misc-body')?.value || getSubSection(getSection(rawContent,'File Scan Result'),'MISC Label Summary');
  const ch = new Set();
  for (const m of body.matchAll(/`([^`]+)`/g)) ch.add(m[1]);
  return ch;
}
function getMiscWarning(channelName) {
  if (!channelName) return '⚠ MISC channel name is required.';
  const ch = getMiscChannels();
  if (ch.size===0) return '⚠ MISC Label Summary is empty. This task will require <code>wait_kernel_update</code> — kernel must provide this MISC channel.';
  if (!ch.has(channelName)) return `⚠ "<code>${esc(channelName)}</code>" not found in MISC Label Summary (found: ${[...ch].map(c=>`<code>${esc(c)}</code>`).join(', ')}). Verify or flag as <code>wait_kernel_update</code>.`;
  return null;
}

// ─── Task Parsing ─────────────────────────────────────────────────────────────
function parseTasks(body) {
  const tasks = [];
  const parts = body.split(/(?=\n###\s+(?:Classical|Potential)\s+Task\s+\d+)/);
  for (const part of parts) {
    const hm = part.match(/###\s+(Classical|Potential)\s+Task\s+(\d+):\s*(.+)/);
    if (!hm) continue;
    const task = { kind:hm[1], num:parseInt(hm[2]), name:hm[3].trim(),
      taskType:'classification', epochMethod:'epoch_by_event_hdf5',
      epochParams:{ tmin:'', tmax:'', overlap:'', segment_length:'', custom:[] },
      labelRoute:'event', metaLevel:'raw', targetRows:[], miscChannel:'', evidence:[], kernelNotes:'' };

    const fv = (field) => { const re=new RegExp(`\\*\\*${escRe(field)}\\*\\*:\\s*\`?([^\`\n]+)\`?`); const m=part.match(re); return m?m[1].trim():''; };
    task.taskType = fv('Task Type') || 'classification';
    task.epochMethod = fv('Epoch Method') || 'epoch_by_event_hdf5';
    task.metaLevel = fv('Meta Level') || 'raw';
    task.labelRoute = fv('Label Route') || 'event';
    task.epochParams = parseEpochParams(fv('Epoch Parameters'), task.epochMethod);

    const tdm = part.match(/\*\*Target Definition\*\*:\s*([\s\S]*?)(?=\n- \*\*\w|$)/);
    if (tdm) {
      const tdb = tdm[1].trim();
      if (tdb.includes('|')) {
        const { rows } = parseMarkdownTable(tdb);
        task.targetRows = rows.map(r=>({ label:(r[0]||'').replace(/^`|`$/g,'').trim(), y:(r[1]||'').trim(), meaning:(r[2]||'').trim() }));
      } else {
        const mm = tdb.match(/`([^`]+)`/);
        task.miscChannel = mm ? mm[1] : tdb.replace(/MISC\s+channel:?\s*/i,'').trim();
      }
    }

    const evm = part.match(/\*\*Evidence\*\*:\s*([\s\S]*?)(?=\n- \*\*\w|$)/);
    if (evm) task.evidence = parseEvidence(evm[1].trim());

    const knm = part.match(/\*\*Kernel Notes\*\*:\s*([\s\S]*?)(?=\n- \*\*\w|$)/);
    if (knm) task.kernelNotes = knm[1].trim();

    tasks.push(task);
  }
  return tasks;
}

function serializeTasks(tasks) {
  let classN=0, potN=0;
  return tasks.map(task => {
    const num = task.kind==='Classical' ? ++classN : ++potN;
    let teStr = '';
    if (task.labelRoute!=='misc' && task.targetRows.length)
      teStr = `, target_events = [${task.targetRows.map(r=>`\`${r.label}\``).join(', ')}]`;
    const epStr = task.epochParamsStr || '';

    let targetDef = '';
    if (task.labelRoute==='misc') {
      targetDef = `MISC channel: \`${task.miscChannel}\``;
    } else {
      const col = task.labelRoute==='info' ? 'Info' : 'Event';
      targetDef = `| ${col} | y | Meaning |\n  |-------|---|---------|`;
      task.targetRows.forEach(r => { targetDef += `\n  | \`${r.label}\` | ${r.y} | ${r.meaning} |`; });
    }

    const evLines = (task.evidence||[]).map(e=>`  - DOI: ${e.ref} — ${e.desc}`).join('\n');

    return `### ${task.kind} Task ${num}: ${task.name}
- **Task Type**: ${task.taskType}
- **Epoch Method**: \`${task.epochMethod}\`
- **Epoch Parameters**: ${epStr}${teStr}
- **Label Route**: \`${task.labelRoute}\`
- **Meta Level**: ${task.metaLevel}
- **Target Definition**:
  ${targetDef}
- **Evidence**:
${evLines}
- **Kernel Notes**: ${task.kernelNotes}`;
  }).join('\n\n');
}

function updateMiscWarning(idx, input) {
  const w = getMiscWarning(input.value.trim());

function addTask(kind) {
  collectTaskCards();
  currentTasks.push({ kind, num:0, name:'', taskType:'classification', epochMethod:'epoch_by_event_hdf5',
    epochParams:{tmin:'',tmax:'',overlap:'',segment_length:'',custom:[]},
    labelRoute:'event', metaLevel:'raw', targetRows:[], miscChannel:'', evidence:[], kernelNotes:'' });
  renderTaskCards(document.getElementById('task-cards-container'));
  const tb = document.getElementById('fst-tab-tasks'); if(tb) tb.textContent=`Tasks (${currentTasks.length})`;
}
function deleteTask(idx) {
  if (!confirm('Remove this task?')) return;
  collectTaskCards(); currentTasks.splice(idx,1);
  renderTaskCards(document.getElementById('task-cards-container'));
  const tb = document.getElementById('fst-tab-tasks'); if(tb) tb.textContent=`Tasks (${currentTasks.length})`;
}

function collectTaskCards() {
  const cards = document.querySelectorAll('.task-card[data-task-idx]');
  if (!cards.length) return;
  currentTasks = [];
  cards.forEach((card, i) => {
    const kindBtn = card.querySelector('.task-kind-btn.selected-classical,.task-kind-btn.selected-potential');
    const kind = kindBtn ? kindBtn.dataset.kind : 'Classical';
    const method = card.querySelector('.task-epoch-method-sel')?.value || 'epoch_by_event_hdf5';
    const lr = card.querySelector('.task-lr-sel')?.value || 'event';
    const task = {
      kind, num:0,
      name: card.querySelector('.task-name-input')?.value.trim()||'',
      taskType: card.querySelector('.task-type-sel')?.value||'classification',
      epochMethod: method,
      epochParams: {tmin:'',tmax:'',overlap:'',segment_length:'',custom:[]},
      labelRoute: lr,
      metaLevel: card.querySelector('.task-ml-sel')?.value||'raw',
      targetRows: [], miscChannel: '', evidence: [], kernelNotes: '',
      epochParamsStr: collectEpochParams(card, i, method),
    };
    if (lr==='misc') {
      task.miscChannel = card.querySelector('.task-misc-channel')?.value.trim()||'';
    } else {
      card.querySelectorAll(`#td-tbody-${i} tr`).forEach(tr => {
        const ins = tr.querySelectorAll('td input');
        if (ins.length>=3) task.targetRows.push({ label:ins[0].value.trim(), y:ins[1].value.trim(), meaning:ins[2].value.trim() });
      });
    }
    // Collect evidence
    const evList = card.querySelector(`#ev-${i}-list`);
    if (evList) evList.querySelectorAll('.evidence-row').forEach(row => {
      const ref = row.querySelector('.evidence-ref')?.value.trim()||'';
      const desc = row.querySelector('.evidence-desc')?.value.trim()||'';
      if (ref||desc) task.evidence.push({ ref, desc });
    });
    // Collect kernel notes
    const knList = card.querySelector(`#kn-${i}-list`);
    if (knList) {
      task.kernelNotes = [...knList.querySelectorAll('.bullet-input')].map(t=>t.value.trim()).filter(Boolean).join('\n');
    }
    currentTasks.push(task);
  });
}

function collectFileScanTasks() {
  const fsrBody = getSection(rawContent, 'File Scan Result');
  const kernelLine = (fsrBody.match(/>\s*\*\*Kernel\*\*:\s*.+/)||['> **Kernel**: N/A'])[0];
  const sha256Line = (fsrBody.match(/>\s*\*\*SHA256\*\*:\s*.+/)||['> **SHA256**: N/A'])[0];
  const esTable = serializeEventTable();
  const esNotes = document.getElementById('es-notes')?.value.trim()||'';
  const esNoteBlock = esNotes ? '\n\n'+esNotes.split('\n').map(l=>'> '+l).join('\n') : '';
  // MISC is read-only — preserve original content from rawContent
  const miscVal = getSubSection(getSection(rawContent,'File Scan Result'),'MISC Label Summary');
  const miscSection = miscVal ? `\n\n### MISC Label Summary\n\n${miscVal}` : '';
  const infoTable = serializeInfoTable();
  rawContent = replaceSection(rawContent, 'File Scan Result',
    `${kernelLine}\n${sha256Line}\n\n### Event Structure\n\n${esTable}${esNoteBlock}${miscSection}\n\n### Info\n\n${infoTable}`);
  collectTaskCards();
  rawContent = replaceSection(rawContent, 'Tasks', serializeTasks(currentTasks));
  dirty = true;
}

// ─── Step 2: DQN & Kernel ─────────────────────────────────────────────────────
function renderDQNKernel(content) {

  const status = statusM ? statusM[1].trim() : 'wait_manual_review';

  const statusInvalid = status && !STATUS_OPTS.includes(status);

  content.innerHTML = `

  <div class="card">
    <div class="card-title">Kernel Responsibilities</div>

      <label>Status</label>

        <select class="status-select" id="kr-status" onchange="onStatusChange(this)">

    if (sel) onStatusChange(sel);

function selectSMR(val) {

}

function buildStatusHint(s) {
  const hints = {
    'wait_kernel_update':  '<span style="color:var(--yellow)">⚠ Pre-review state (set by LLM).</span> Structural gaps in Event Structure / Label Route / MISC remain. Reviewers should not leave the document in this state after completing their review.',
    'wait_manual_review':  '<span style="color:var(--accent)">ℹ Pre-review state (set by LLM).</span> Document is structurally sufficient; awaiting human reviewer sign-off.',
    'completed':           '<span style="color:var(--green)">✓ Reviewer sign-off.</span> You confirm the review is complete. Known issues should be documented in DQN above. This is the normal final state after a review.',
    'hallucination':       '<span style="color:var(--red)">✗ Document-level failure.</span> Use only when the entire document is fundamentally unreliable and cannot be reviewed or fixed (e.g. URL dead, content completely mismatched, no credible basis for any field). Admin will consider deletion or re-scan.',
  };
  return hints[s] || 'Select a status value.';
}

function onStatusChange(sel) {
  const hint = document.getElementById('status-hint');
  if (hint) hint.innerHTML = buildStatusHint(sel.value);
  // Style the select itself for hallucination
  sel.style.color = sel.value === 'hallucination' ? 'var(--red)' : '';
  sel.style.fontWeight = sel.value === 'hallucination' ? '700' : '';
}

function collectDQNKernel() {
  const dqnText = collectBullets('dqn');
  rawContent = replaceSection(rawContent, 'Data Quality Notes', dqnText);
  const smr = document.getElementById('smr-yes')?.classList.contains('selected') ? 'Yes' : 'No';
  const status = document.getElementById('kr-status')?.value || 'wait_manual_review';
  rawContent = replaceSection(rawContent, 'Kernel Responsibilities', `> **Super Meta Required**: ${smr}\n> **Status**: ${status}`);
  const ds = allDatasets.find(d=>d.name===currentDataset);
  if (ds) { ds.status=status; renderDatasetList(); }
  dirty = true;
}

// ─── Collect Step ─────────────────────────────────────────────────────────────
function collectStep(idx) {
  try {
    if (idx===0) collectMetaParadigm();
    else if (idx===1) collectFileScanTasks();
    else if (idx===2) collectDQNKernel();
  } catch(e) { console.warn('collectStep error',e); }
}

// ─── Confirm & Preview ────────────────────────────────────────────────────────
function confirmAndPreview() {
  collectStep(currentStep);
  // Check guide items
  const allItems = [];
  STEP_GUIDE.forEach((step, si) => step.sections.forEach(sec => sec.items.forEach(item => allItems.push(item.key))));
  const unchecked = allItems.filter(key => !guideChecks[key]);
  if (unchecked.length > 0) {
    // Highlight in guide
    switchRightTab('guide');
    renderStepGuide();
    setTimeout(() => {
      unchecked.forEach(key => {
        const el = document.querySelector(`.guide-check[data-key="${key}"]`);
        if (el) el.classList.add('highlight-warn');
      });
    }, 100);
    if (!confirm(`${unchecked.length} step guide item(s) not yet checked. Proceed to preview anyway?`)) return;
  }
  // Open preview
  document.getElementById('preview-markdown').innerHTML = marked.parse(rawContent);
  document.getElementById('preview-modal-overlay').classList.add('open');
  previewSeen = true;
}

function closePreview() { document.getElementById('preview-modal-overlay').classList.remove('open'); }

async function saveFromPreview() {
  closePreview();
  await saveFile();
}

document.getElementById('preview-modal-overlay').onclick = function(e) { if (e.target===this) closePreview(); };

// ─── Save File ────────────────────────────────────────────────────────────────
async function saveFile() {
  collectStep(currentStep);
  if (!currentDataset) return;
  const saveStatus = document.getElementById('save-status');
  saveStatus.textContent = 'Saving…';
  try {
    const r = await fetch(`/api/dataset/${encodeURIComponent(currentDataset)}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: rawContent }),
    });
    if (r.ok) { dirty=false; saveStatus.textContent='✓ Saved'; setTimeout(()=>saveStatus.textContent='',3000); }
    else saveStatus.textContent='✗ Error';
  } catch(e) { saveStatus.textContent='✗ '+e.message; }
}

// ─── Step Guide ───────────────────────────────────────────────────────────────
function toggleGuideCheck(key) {
  guideChecks[key] = !guideChecks[key];
  renderStepGuide();
}

function renderStepGuide() {
  const container = document.getElementById('guide-content');
  if (!currentDataset) { container.innerHTML='<p style="color:var(--muted);font-size:12px;padding:12px">Select a dataset to begin.</p>'; return; }
  const guide = STEP_GUIDE[currentStep];
  if (!guide) return;
  let html = `<div class="guide-step-title">${esc(guide.title)}</div>`;
  guide.sections.forEach(sec => {
    const total = sec.items.length;
    const done = sec.items.filter(item => guideChecks[item.key]).length;
    html += `<div class="guide-section">
      <div class="guide-section-title">${esc(sec.heading)}<span class="sec-check-count">${done}/${total}</span></div>`;
    sec.items.forEach((item, i) => {
      const checked = guideChecks[item.key] || false;
      html += `<div class="guide-check ${checked?'checked':''}" data-key="${item.key}" onclick="toggleGuideCheck('${item.key}')">
        <div class="guide-check-box"></div>
        <span class="guide-check-num">${i+1}.</span>
        <span class="guide-check-text">${item.text}</span>
      </div>`;
    });
    html += '</div>';
  });
  // Overall progress
  const allItems = guide.sections.flatMap(s=>s.items);
  const totalDone = allItems.filter(item=>guideChecks[item.key]).length;
  html += `<div style="margin-top:8px;font-size:11px;color:var(--muted);text-align:right">${totalDone}/${allItems.length} checks complete for this step</div>`;
  container.innerHTML = html;
}

// ─── Right Panel ──────────────────────────────────────────────────────────────
function switchRightTab(tab) {
  ['guide','rulebook','chat'].forEach(t => {
    document.getElementById(`rtab-${t}`).classList.toggle('active', t===tab);
    document.getElementById(`pane-${t}`).classList.toggle('visible', t===tab);
  });
}

// ─── Rulebook ─────────────────────────────────────────────────────────────────
function renderRulebook() {
  const hint = STEP_RULEBOOK_HINTS[currentStep]||'';
  const search = document.getElementById('rb-search')?.value.trim()||'';
  const query = search||hint;
  let html = '';
  if (hint&&!search) html+=`<div class="rb-step-hint">Step hints: ${esc(hint)}</div>`;
  if (!rulebookRaw) { document.getElementById('rulebook-content').innerHTML='Loading…'; return; }
  if (query) {
    const terms=query.split(/[,\s]+/).filter(Boolean).map(t=>t.toLowerCase());
    const lines=rulebookRaw.split('\n'); let sections=[],buf=[],inMatch=false;
    lines.forEach(line => {
      const isH=/^#{1,3}\s/.test(line);
      if (isH) { if(inMatch&&buf.length) sections.push(buf.join('\n')); buf=[line]; inMatch=terms.some(t=>line.toLowerCase().includes(t)); }
      else { buf.push(line); if(!inMatch&&terms.some(t=>line.toLowerCase().includes(t))) inMatch=true; }
    });
    if(inMatch&&buf.length) sections.push(buf.join('\n'));
    html+=sections.length ? marked.parse(sections.join('\n\n---\n\n')) : '<p style="color:var(--muted);font-size:12px">No matching sections.</p>';
    if (!sections.length&&!search) html+=marked.parse(rulebookRaw.slice(0,3000)+'\n\n…');
  } else { html+=marked.parse(rulebookRaw); }
  document.getElementById('rulebook-content').innerHTML=html;
}
function filterRulebook() { renderRulebook(); }

// ─── LLM Chat ─────────────────────────────────────────────────────────────────
const STEP_FOCUS = [
  'Focus on: Meta fields (Dataset, Year, URL, Category, Subjects, Channels, Sampling Rate), Manual Review, and the Paradigm description.',
  'Focus on: File Scan Result (Event Structure, MISC, Info), and all Tasks (Epoch Method, Epoch Parameters, Target Definition, Evidence, Label Route).',
  'Focus on: Data Quality Notes and Kernel Responsibilities (Super Meta Required, Status).',
];

function buildChatSystemPrompt() {
  const stepFocus = STEP_FOCUS[currentStep] || '';
  return [
    `You are an expert EEG dataset documentation auditor. You are currently reviewing the dataset "${currentDataset || '(none selected)'}" at step ${currentStep+1}: "${STEP_LABELS[currentStep]}".`,
    stepFocus,
    '',
    '=== FULL ANALYSIS DOCUMENT ===',
    '```markdown',
    rawContent || '(No dataset selected)',
    '```',
    '',
    '=== RULEBOOK (full) ===',
    rulebookRaw || '(Rulebook not loaded)',
    '',
    'Answer concisely and precisely. Reference specific sections or rules by name when relevant.',
  ].join('\n');
}

function chatKeydown(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();} }

async function sendChat() {
  const input=document.getElementById('chat-input');
  const msg=input.value.trim(); if(!msg) return;
  input.value=''; appendChat('user',msg);
  llmHistory.push({role:'user',content:msg});
  appendChat('assistant','…');
  updateChatTokenHint();
  try {
    const r=await fetch('/api/llm',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'system',content:buildChatSystemPrompt()},...llmHistory]})});
    const d=await r.json();
    const la=document.querySelector('#chat-messages .chat-msg.assistant:last-child');
    if(d.error){
      if(la) la.querySelector('.chat-bubble').innerHTML=`<span style="color:var(--red)">${esc(d.error)}</span>`;
    } else {
      const rawReply=d.choices?.[0]?.message?.content||JSON.stringify(d);
      // Strip and render <think> blocks separately
      const thinkMatch = rawReply.match(/<think>([\s\S]*?)<\/think>/i);
      const thinkText = thinkMatch ? thinkMatch[1].trim() : null;
      const mainText = rawReply.replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
      if(la) renderAssistantMessage(la, thinkText, mainText);
      // Store clean reply (without think tags) in history
      llmHistory.push({role:'assistant',content:rawReply});
      updateChatTokenHint();
    }
  } catch(e) {
    const la=document.querySelector('#chat-messages .chat-msg.assistant:last-child');
    if(la) la.querySelector('.chat-bubble').textContent='Error: '+e.message;
  }
}

function renderAssistantMessage(wrapper, thinkText, mainText) {
  const bubble = wrapper.querySelector('.chat-bubble');
  let html = '';
  if(thinkText) {
    const id = 'think-' + Date.now();
    html += `<div class="thinking-block">
      <button class="thinking-toggle" onclick="document.getElementById('${id}').classList.toggle('open')">
        💭 <span>Show thinking (${thinkText.length} chars)</span>
      </button>
      <div class="thinking-content" id="${id}">${esc(thinkText)}</div>
    </div>`;
  }
  html += marked.parse(mainText || '(empty response)');
  bubble.innerHTML = html;
  const c = document.getElementById('chat-messages');
  c.scrollTop = c.scrollHeight;
}

function appendChat(role, text) {
  const c=document.getElementById('chat-messages');
  const d=document.createElement('div'); d.className=`chat-msg ${role}`;
  const b=document.createElement('div'); b.className='chat-bubble';
  if(role==='assistant') {
    b.textContent = text; // placeholder; replaced by renderAssistantMessage
  } else {
    b.innerHTML = esc(text);
  }
  d.appendChild(b); c.appendChild(d); c.scrollTop=c.scrollHeight;
}

function clearChat() {
  if(llmHistory.length && !confirm('Clear all chat history?')) return;
  llmHistory=[];
  document.getElementById('chat-messages').innerHTML='';
  updateChatTokenHint();
}

async function compressChat() {
  if(llmHistory.length<2) { alert('Not enough history to compress.'); return; }
  appendChat('assistant','⚡ Compressing history…');
  try {
    const summary_prompt = 'Summarize the following conversation history into a compact context paragraph that preserves all key decisions, findings, and open questions. Be brief.\n\n' +
      llmHistory.map(m=>`${m.role.toUpperCase()}: ${m.content}`).join('\n\n');
    const r=await fetch('/api/llm',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:summary_prompt}]})});
    const d=await r.json();
    const la=document.querySelector('#chat-messages .chat-msg.assistant:last-child');
    if(d.error){ if(la) la.querySelector('.chat-bubble').innerHTML=`<span style="color:var(--red)">${esc(d.error)}</span>`; return; }
    const summary=d.choices?.[0]?.message?.content||'';
    // Replace history with single summary message
    llmHistory=[{role:'assistant',content:`[Compressed context]\n${summary}`}];
    if(la) la.querySelector('.chat-bubble').innerHTML=`<strong>⚡ History compressed.</strong><br><small style="color:var(--muted)">Previous conversation summarized into context.</small><br><br>${marked.parse(summary)}`;
    updateChatTokenHint();
  } catch(e) {
    const la=document.querySelector('#chat-messages .chat-msg.assistant:last-child');
    if(la) la.querySelector('.chat-bubble').textContent='Error: '+e.message;
  }
}

function updateChatTokenHint() {
  const hint=document.getElementById('chat-token-hint');
  if(!hint) return;
  const total = llmHistory.reduce((n,m)=>n+m.content.length,0);
  hint.textContent = `~${Math.round((rawContent.length+rulebookRaw.length+total)/4).toLocaleString()} tokens`;
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function openSettings(){document.getElementById('modal-overlay').classList.add('open');}
function closeSettings(){document.getElementById('modal-overlay').classList.remove('open');}
async function saveSettings(){
  const url=document.getElementById('cfg-url').value.trim();
  const key=document.getElementById('cfg-key').value.trim();
  const model=document.getElementById('cfg-model').value.trim();
  const proxy=document.getElementById('cfg-proxy').value.trim();
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,key,model,proxy})});
  closeSettings();
}
document.getElementById('modal-overlay').onclick=function(e){if(e.target===this)closeSettings();};

// ─── Utils ────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── Start ────────────────────────────────────────────────────────────────────
init();
</script>
