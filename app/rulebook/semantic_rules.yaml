# eeg_kernel_agent — Semantic Rulebook v3.0
# Used by detect.py for batch checking of analysis.md and kernel files.
#
# Check types:
#   section_exists — string presence check
#   pattern        — regex match (violated=found, unless require_match:true → violated=not found)
#   field_value    — extract named field, check against allowed_values list
#   cross_check    — custom Python function registered in detect.py (see function: key)
#
# ─── HARD CONSTRAINTS (enforced in generate.py, not detectable by detect.py) ─
#
# HC-1  File Scan Result 中的数据性字段（Event ID、Count、Info 表数值、
#       Kernel SHA256 fingerprint）必须来自 kernel scan 的程序输出，
#       LLM 不得发明或篡改这些字段。语义性字段（Event Type、Meaning）
#       由 LLM 在独立的推断步骤中生成，但必须基于数据集文件中的实际
#       证据，不得凭空编造。
#
# HC-2  Event Meaning 和 Type 的推断必须基于数据集中的实际证据
#       （events.tsv、sidecar JSON、README 等）。LLM 可参考任意上下文
#       信息，但不得将无关的参考文献、领域惯例或 BCI 竞赛编码体系
#       作为推断依据（例如不得仅因 event ID 为 1-4 就推断为四类运动
#       想象）。推断结果一旦确定即为锁定值，后续流程不得再修改。
#
# HC-3  Meta Area fields (Channels, Sampling Rate) should be cross-referenced
#       against the locator cache CSV. LLM may fill narrative gaps but must
#       not override program-derived values.
#
# HC-4  Agent may only set Status to:
#         wait_manual_review  — pipeline completed, no structural error
#         wait_kernel_update  — kernel failed or scan incomplete
#       "completed" and "hallucination" are reserved for human reviewers only.
#
# HC-5  Kernel must NOT remap original event IDs. Prefix-based enrichment is
#       allowed (e.g., subject_attr-event_id, session_attr-event_id).
#       Original event IDs must pass through unchanged.
#
# HC-6  Kernel channel remapping is only allowed when explicit evidence exists
#       in the dataset directory (companion file, README, sidecar) mapping
#       ambiguous/numeric channels to named channels. Add a comment in kernel
#       citing the evidence file.
#
# HC-7  完整 scan 次数应最少化，避免重复扫描同一数据集。pipeline 应在
#       最终输出前执行一致性校验，确保文档内容与 scan 结果吻合。
# ─────────────────────────────────────────────────────────────────────────────

rules:
  # ── Group A: Document Structure ───────────────────────────────────────────────
  # Aligns with app/template_spec.py. Violations here will also fail
  # template_checker.py when the document is viewed in the app.

  - id: "has_paradigm"
    desc: "analysis.md must contain ## Paradigm section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Paradigm"
    severity: "error"

  - id: "has_file_scan_result"
    desc: "analysis.md must contain ## File Scan Result section."
    target: "analysis_md"
    check: "section_exists"
    section: "## File Scan Result"
    severity: "error"

  - id: "has_tasks"
    desc: "analysis.md must contain ## Tasks section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Tasks"
    severity: "error"

  - id: "has_data_quality_notes"
    desc: "analysis.md must contain ## Data Quality Notes section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Data Quality Notes"
    severity: "error"

  - id: "has_kernel_responsibilities"
    desc: "analysis.md must contain ## Kernel Responsibilities section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Kernel Responsibilities"
    severity: "error"

  - id: "has_event_structure"
    desc: "## File Scan Result must contain ### Event Structure subsection."
    target: "analysis_md"
    check: "section_exists"
    section: "### Event Structure"
    severity: "error"

  - id: "has_info_subsection"
    desc: "## File Scan Result must contain ### Info subsection (rulebook 第57条之一)."
    target: "analysis_md"
    check: "section_exists"
    section: "### Info"
    severity: "error"

  - id: "no_stim_label_summary"
    desc: "STIM Label Summary is deprecated (rulebook v0.2+) and must not appear."
    target: "analysis_md"
    check: "pattern"
    pattern: "^##\\s+STIM Label Summary"
    severity: "error"

  - id: "section_order_correct"
    desc: "Top-level sections must follow order: Paradigm → File Scan Result → Tasks → Data Quality Notes → Kernel Responsibilities."
    target: "analysis_md"
    check: "cross_check"
    function: "section_order"
    severity: "error"

  - id: "no_extra_top_level_sections"
    desc: "Only the 5 required ## sections are allowed. No extra top-level headings (rulebook 第30条之二)."
    target: "analysis_md"
    check: "cross_check"
    function: "no_extra_sections"
    severity: "error"

  # ── Group B: Field Legal Values ───────────────────────────────────────────────
  # Aligns with app/rulebook.md explicit enumeration rules.

  - id: "status_valid_value"
    desc: "Status must be one of: wait_kernel_update, wait_manual_review, completed, hallucination (rulebook 第42条之二)."
    target: "analysis_md"
    check: "field_value"
    field_pattern: ">\\s*\\*\\*Status\\*\\*:\\s*(.+)"
    allowed_values:
      - "wait_kernel_update"
      - "wait_manual_review"
      - "completed"
      - "hallucination"
    severity: "error"

  - id: "super_meta_required_valid_value"
    desc: "Super Meta Required must be exactly 'Yes' or 'No' (rulebook 第37条)."
    target: "analysis_md"
    check: "field_value"
    field_pattern: ">\\s*\\*\\*Super Meta Required\\*\\*:\\s*(.+)"
    allowed_values:
      - "Yes"
      - "No"
    severity: "error"

  - id: "category_valid_value"
    desc: "Category must be one of 6 valid values (rulebook 第25条): Complex Applied / High-level Mental / Action/Output / Sensory/Response / Biological State / Others."
    target: "analysis_md"
    check: "field_value"
    field_pattern: "\\*\\*Category\\*\\*:\\s*([^|\\n]+)"
    allowed_values:
      - "Complex Applied"
      - "High-level Mental"
      - "Action/Output"
      - "Sensory/Response"
      - "Biological State"
      - "Others"
    severity: "error"

  - id: "label_route_no_deprecated"
    desc: "Label Route must not use deprecated values Annotation/STIM/MISC (uppercase). Valid values: event, misc, info (rulebook 第8条, v0.4+)."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\*\\*Label Route\\*\\*[^\\n]*`(Annotation|STIM|MISC)`"
    case_sensitive: true
    severity: "error"

  - id: "event_type_no_deprecated"
    desc: "Event Structure Type column must not use deprecated values short/long/rest. Use event or admin only (rulebook 第46条, v0.2+)."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\|\\s*(short|long|rest)\\s*\\|"
    severity: "error"

  - id: "kernel_fingerprint_exists"
    desc: "## File Scan Result must begin with a kernel fingerprint blockquote containing Kernel SHA256 (rulebook 第42条之五)."
    target: "analysis_md"
    check: "pattern"
    pattern: ">\\s*\\*\\*Kernel SHA256\\*\\*:"
    require_match: true
    severity: "error"

  - id: "no_placeholder_doi"
    desc: "Evidence DOIs must not be placeholder strings (TODO / N/A / none / unknown / placeholder)."
    target: "analysis_md"
    check: "pattern"
    pattern: "DOI.*`(TODO|N/A|none|unknown|placeholder)`"
    severity: "warning"

  # ── Group C: Semantic Consistency ─────────────────────────────────────────────

  - id: "super_meta_matches_tasks"
    desc: "Super Meta Required must match actual Meta Level in Tasks: Yes if any task has Meta Level=super, No if all raw (rulebook 第37-38条)."
    target: "analysis_md"
    check: "cross_check"
    function: "super_meta_consistency"
    severity: "error"

  - id: "target_events_in_event_structure"
    desc: "All event IDs referenced in Tasks Target Definition tables must appear in ### Event Structure."
    target: "analysis_md"
    check: "cross_check"
    function: "target_events_exist"
    severity: "error"

  - id: "misc_route_requires_misc_section"
    desc: "If any task uses Label Route=misc, ### MISC Label Summary must exist (rulebook 第55条)."
    target: "analysis_md"
    check: "cross_check"
    function: "misc_route_requires_section"
    severity: "error"

  - id: "classical_task_has_evidence"
    desc: "Every Classical Task must have a non-empty Evidence field (rulebook 第62条)."
    target: "analysis_md"
    check: "cross_check"
    function: "classical_task_evidence"
    severity: "error"

  - id: "info_completeness_valid"
    desc: "### Info table Completeness column must use: complete, partial, incomplete, or missing (rulebook 第57条之三)."
    target: "analysis_md"
    check: "cross_check"
    function: "info_completeness_values"
    severity: "error"

  - id: "kernel_sha256_matches_file"
    desc: "Kernel SHA256 in document must match actual SHA256 of eeg_kernel_agent/kernels/<dataset>.py. Mismatch means doc was not produced by the current kernel."
    target: "analysis_md"
    check: "cross_check"
    function: "kernel_sha256_matches"
    severity: "error"

  - id: "no_auto_removed_tasks"
    desc: "Tasks section must not contain [AUTO-REMOVED] blocks. These indicate guard-removed hallucinations; dataset needs regeneration."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\[AUTO-REMOVED\\]"
    severity: "warning"

  - id: "no_mi_label_on_phase_marker"
    desc: "Event Structure must not assign MI class labels to events whose Meaning is a trial phase marker (rest/ready/task/interval). See HC-2."
    target: "analysis_md"
    check: "cross_check"
    function: "no_mi_on_phase_markers"
    severity: "error"

  - id: "no_hallucinated_bcic_classes"
    desc: "Must not assign BCIC IV 2a class codes (769/770/771/772) as event labels without explicit sidecar evidence."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\b(769|770|771|772)\\b.*class"
    severity: "warning"

  - id: "kr_has_super_meta"
    desc: "## Kernel Responsibilities must contain > **Super Meta Required**: blockquote field (rulebook 第37条, 第42条之四)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_has_super_meta"
    severity: "error"

  - id: "kr_has_status"
    desc: "## Kernel Responsibilities must contain > **Status**: blockquote field (rulebook 第42条之一)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_has_status"
    severity: "error"

  - id: "kr_only_blockquote_fields"
    desc: "## Kernel Responsibilities must contain only the two blockquote fields (Super Meta Required, Status), no extra prose (rulebook 第42条之四)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_only_blockquote_fields"
    severity: "warning"

  - id: "dqn_bullet_format"
    desc: "## Data Quality Notes content must use '- ' bullet format (rulebook 第83条)."
    target: "analysis_md"
    check: "cross_check"
    function: "dqn_bullet_format"
    severity: "warning"

  - id: "task_type_no_normal"
    desc: "Task headings must be 'Classical Task' or 'Potential Task' only. 'Normal Task' is not a valid type."
    target: "analysis_md"
    check: "pattern"
    pattern: "###\\s+Normal\\s+Task"
    severity: "error"

  - id: "task_order_classical_first"
    desc: "All Classical Tasks must appear before all Potential Tasks in ## Tasks section."
    target: "analysis_md"
    check: "cross_check"
    function: "task_order_classical_first"
    severity: "error"

  - id: "task_numbering_from_one"
    desc: "Task numbering must start from 1 within each type and increase consecutively."
    target: "analysis_md"
    check: "cross_check"
    function: "task_numbering_from_one"
    severity: "error"

  # ── Group C+: v3 Task Taxonomy (Epoch/Label Separation) ──────────────────────

  - id: "label_field_required_for_nonevent"
    desc: "Tasks with Label Route ∈ {misc, info} must declare **Label Field** (rulebook 第77条之三)."
    target: "analysis_md"
    check: "cross_check"
    function: "label_field_required_for_nonevent"
    severity: "error"

  - id: "label_field_absent_for_event"
    desc: "Tasks with Label Route = event must NOT declare **Label Field** (rulebook 第77条之三)."
    target: "analysis_md"
    check: "cross_check"
    function: "label_field_absent_for_event"
    severity: "error"

  - id: "info_label_field_in_info_section"
    desc: "For Label Route = info tasks, the Label Field should be registered in ### Info. Downgraded to warning in favour of `info_label_field_in_participants` which reads participants.tsv directly (rulebook 第57条之二 第5款, 第77条之三 第3款)."
    target: "analysis_md"
    check: "cross_check"
    function: "info_label_field_in_info_section"
    severity: "warning"

  - id: "info_label_field_in_participants"
    desc: "For Label Route = info tasks, the Label Field must correspond to a column in participants.tsv (authoritative source; rulebook v3.1)."
    target: "analysis_md"
    check: "cross_check"
    function: "info_label_field_in_participants"
    severity: "error"

  - id: "misc_label_field_has_misc_channel"
    desc: "For Label Route = misc tasks, the Label Field must be a native MISC channel or a derived misc channel declared in kernel_requirements (rulebook v3.1)."
    target: "analysis_md"
    check: "cross_check"
    function: "misc_label_field_has_misc_channel"
    severity: "error"

  - id: "task_dataset_dispatchable"
    desc: "Every Task block must be statically dispatchable by dataset_api.build_dataset_from_task(dry_run=True) (rulebook v3.1)."
    target: "analysis_md"
    check: "cross_check"
    function: "task_dataset_dispatchable"
    severity: "error"

  - id: "misc_label_field_in_misc_section"
    desc: "For Label Route = misc tasks, the Label Field must be registered in ### MISC Label Summary (rulebook 第77条之三 第3款)."
    target: "analysis_md"
    check: "cross_check"
    function: "misc_label_field_in_misc_section"
    severity: "error"

  - id: "target_def_schema_matches_route"
    desc: "Target Definition table header must match the Route × Task Type matrix (rulebook 第77条之四)."
    target: "analysis_md"
    check: "cross_check"
    function: "target_def_schema_matches_route"
    severity: "error"

  - id: "single_target_per_task"
    desc: "Target Definition first column (Label Field) must have exactly one unique value per task (rulebook 第77条之五)."
    target: "analysis_md"
    check: "cross_check"
    function: "single_target_per_task"
    severity: "error"

  - id: "misc_classification_forbidden"
    desc: "Label Route = misc requires Task Type = regression; classification on misc is forbidden (rulebook 第77条之六)."
    target: "analysis_md"
    check: "cross_check"
    function: "misc_classification_forbidden"
    severity: "error"

  - id: "classification_task_has_multiple_classes"
    desc: "Classification tasks must have ≥2 distinct y values in Target Definition (rulebook 第77条之七)."
    target: "analysis_md"
    check: "cross_check"
    function: "classification_task_has_multiple_classes"
    severity: "error"

  - id: "classification_y_zero_indexed_sequential"
    desc: "Classification tasks y values must be 0-based sequential ints: distinct y set == set(range(N)). Many-to-one mapping allowed (e.g. A→0, B→0, C→1 is valid; {0,1,3} or {1,2} are not). Applies to both event and info route TD tables."
    target: "analysis_md"
    check: "cross_check"
    function: "classification_y_zero_indexed_sequential"
    severity: "error"

  - id: "derived_misc_requires_super_meta"
    desc: "Tasks referencing a derived misc Label Field must have Meta Level = super (rulebook 第77条之八)."
    target: "analysis_md"
    check: "cross_check"
    function: "derived_misc_requires_super_meta"
    severity: "error"

  - id: "segmentation_requires_nonevent_route"
    desc: "Epoch Method = epoch_by_segmentation_hdf5 ⇒ Label Route must be misc or info, never event."
    target: "analysis_md"
    check: "cross_check"
    function: "segmentation_requires_nonevent_route"
    severity: "error"

  - id: "segmentation_requires_empty_target_events"
    desc: "Epoch Method = epoch_by_segmentation_hdf5 ⇒ target_events must be empty (rulebook 第72条)."
    target: "analysis_md"
    check: "cross_check"
    function: "segmentation_requires_empty_target_events"
    severity: "error"

  - id: "epoch_parameters_complete"
    desc: "Epoch Parameters must list the minimum required keys for the declared Epoch Method (rulebook 第69–72条)."
    target: "analysis_md"
    check: "cross_check"
    function: "epoch_parameters_complete"
    severity: "error"

  - id: "manual_review_blank"
    desc: "Manual Review field must be blank in generated documents (rulebook 第30条之三)."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\*\\*Manual Review\\*\\*:\\s*\\S"
    severity: "warning"

  # ── Group D: Kernel Code Constraints ──────────────────────────────────────────
  # HC-5 reference: no event remapping; prefix enrichment allowed.
  # Kernel safety: no destructive file operations, no shell calls.

  - id: "kernel_has_kernel_id"
    desc: "Every kernel file must define KERNEL_ID."
    target: "kernel"
    check: "pattern"
    pattern: "KERNEL_ID[^=]*="
    require_match: true
    severity: "error"

  - id: "kernel_has_apply"
    desc: "Every kernel file must implement apply()."
    target: "kernel"
    check: "pattern"
    pattern: "def apply"
    require_match: true
    severity: "error"

  - id: "kernel_no_shell_commands"
    desc: "Kernel must not use os.system, subprocess.call, or shell=True."
    target: "kernel"
    check: "pattern"
    pattern: "(os\\.system|subprocess\\.call|shell\\s*=\\s*True)"
    severity: "error"

  - id: "kernel_no_file_writes"
    desc: "Kernel must not write or delete files."
    target: "kernel"
    check: "pattern"
    pattern: "(open\\(.*['\"]w['\"]|os\\.remove|shutil\\.rmtree|Path.*\\.write_text)"
    severity: "error"

  - id: "kernel_no_event_remapping"
    desc: "Kernel must not hard-remap original event IDs. Prefix enrichment (attr-event_id) is allowed; replacing/renaming event IDs is not (HC-5)."
    target: "kernel"
    check: "pattern"
    pattern: "(event_id_map\\s*=|rename_events\\s*=|replace_events\\s*=|\\.rename\\s*\\(.*[\"']event)"
    severity: "warning"
