<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>auto_eeg</title>
<style>
:root {
  --bg: #1a1a1a; --bg2: #242424; --bg3: #2e2e2e;
  --text: #e0e0e0; --text2: #888; --border: #3a3a3a;
  --ok: #4caf78; --err: #e05a5a; --accent: #5b9bd5;
  --warn: #e0a050;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 15px; color: var(--accent); }
header .sub { color: var(--text2); font-size: 11px; }
.main { display: flex; flex: 1; overflow: hidden; }

/* Left panel */
.left { width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.left-header { padding: 8px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
.left-header input { flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 4px 6px; border-radius: 3px; font-size: 12px; }
#ds-list { flex: 1; overflow-y: auto; }
.ds-item { padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 7px; }
.ds-item:hover { background: var(--bg3); }
.ds-item.selected { background: #1e2d3d; }
.ds-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
.badge.k { background: #2a3d2a; color: var(--ok); }
.badge.r { background: #2a2a3d; color: var(--accent); }
.badge.run { background: #3d3d2a; color: var(--warn); }
.badge.done { background: #2a3d2a; color: var(--ok); }
.badge.err { background: #3d2a2a; color: var(--err); }

/* Right panel */
.right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .ds-label { color: var(--accent); font-weight: 600; min-width: 180px; font-size: 12px; }
.btn { padding: 5px 12px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; border-radius: 3px; font-size: 12px; font-family: monospace; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: #1e3a5a; border-color: var(--accent); color: var(--accent); }
.btn.danger { border-color: var(--err); color: var(--err); }
.btn.warn { border-color: var(--warn); color: var(--warn); }

/* Content area with tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 12px; }
.tab { padding: 6px 14px; cursor: pointer; font-size: 12px; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.tab-pane { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.tab-pane.active { display: flex; }

/* Log pane */
#log-pane { padding: 8px; overflow-y: auto; font-size: 11px; line-height: 1.6; }
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.ok { color: var(--ok); }
.log-line.err { color: var(--err); }
.log-line.warn { color: var(--warn); }

/* Result pane */
#result-pane { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.result-section { flex: 1; overflow-y: auto; padding: 12px; }
.result-section h3 { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.result-section pre { background: var(--bg2); border: 1px solid var(--border); padding: 8px; border-radius: 3px; font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; max-height: 40vh; }

/* Progress pane */
#progress-pane { padding: 12px; overflow-y: auto; }
.progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.phase-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.phase-dot.done { background: var(--ok); }
.phase-dot.active { background: var(--warn); }
.phase-dot.fail { background: var(--err); }

/* Settings modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 20px; width: 500px; max-height: 80vh; overflow-y: auto; }
.modal h2 { font-size: 14px; margin-bottom: 16px; color: var(--accent); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.field input, .field select { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 3px; font-size: 12px; font-family: monospace; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<header>
  <h1>auto_eeg</h1>
  <span class="sub">Automated EEG kernel + analysis.md generation</span>
  <div style="flex:1"></div>
  <button class="btn" onclick="openSettings()">Settings</button>
</header>

<div class="main">
  <!-- Left: dataset list -->
  <div class="left">
    <div class="left-header">
      <input id="ds-filter" placeholder="Filter datasets..." oninput="renderDatasets()">
    </div>
    <div id="ds-list"></div>
  </div>

  <!-- Right: controls + log -->
  <div class="right">
    <div class="toolbar">
      <span class="ds-label" id="selected-label">(no dataset selected)</span>
      <button class="btn primary" id="btn-run" onclick="startRun(false)" disabled>Start</button>
      <button class="btn warn" id="btn-resume" onclick="startResume()" disabled>Resume</button>
      <button class="btn danger" id="btn-pause" onclick="doPause()" disabled>Pause</button>
      <button class="btn" id="btn-fresh" onclick="startRun(true)" disabled>Fresh Start</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('log')">Log</div>
      <div class="tab" onclick="switchTab('progress')">Progress</div>
      <div class="tab" onclick="switchTab('result')">Results</div>
    </div>

    <div class="tab-content">
      <div class="tab-pane active" id="pane-log">
        <div id="log-pane"></div>
      </div>
      <div class="tab-pane" id="pane-progress">
        <div id="progress-pane"><p style="color:var(--text2);padding:12px">Select a dataset to see progress.</p></div>
      </div>
      <div class="tab-pane" id="pane-result">
        <div id="result-pane">
          <div class="result-section">
            <h3>Kernel</h3>
            <pre id="kernel-content">(no data)</pre>
            <h3 style="margin-top:12px">analysis.md</h3>
            <pre id="analysis-content">(no data)</pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="field"><label>LLM API URL</label><input id="cfg-url" placeholder="https://api.example.com/v1"></div>
    <div class="field"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
    <div class="field"><label>Model</label><input id="cfg-model" placeholder="minimax-text-01"></div>
    <div class="field"><label>Proxy (optional)</label><input id="cfg-proxy" placeholder="http://127.0.0.1:7890"></div>
    <div class="field"><label>Python Environment</label><input id="cfg-python" placeholder="/usr/bin/python3"></div>
    <div class="field"><label>EEGUnity Path (optional)</label><input id="cfg-eegunity" placeholder="/path/to/Script/eegunity"></div>
    <div class="field"><label>Dataset Roots (one per line)</label>
      <textarea id="cfg-roots" rows="3" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:3px;font-size:12px;font-family:monospace;resize:vertical"></textarea>
    </div>
    <div class="field"><label>Workers</label><input id="cfg-workers" type="number" min="1" max="32" value="2"></div>
    <div class="field"><label>LLM Budget (max prompt calls)</label><input id="cfg-budget" type="number" min="10" max="2000" value="500"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
let allDatasets = [];
let selectedDs = null;
let sseSource = null;
let _running = false;

// ── Dataset list ──────────────────────────────────────────────────────────

async function loadDatasets() {
  const r = await fetch('/api/datasets');
  allDatasets = await r.json();
  renderDatasets();
}

function renderDatasets() {
  const q = document.getElementById('ds-filter').value.toLowerCase();
  const list = document.getElementById('ds-list');
  list.innerHTML = '';
  for (const ds of allDatasets) {
    if (q && !ds.name.toLowerCase().includes(q)) continue;
    const div = document.createElement('div');
    div.className = 'ds-item' + (ds.name === selectedDs ? ' selected' : '');
    let badges = '';
    if (ds.has_kernel) badges += '<span class="badge k">K</span>';
    if (ds.has_refs) badges += '<span class="badge r">R</span>';
    if (ds.running) badges += '<span class="badge run">RUN</span>';
    else if (ds.progress_status === 'done') badges += '<span class="badge done">OK</span>';
    else if (ds.progress_status === 'failed') badges += '<span class="badge err">FAIL</span>';
    else if (ds.progress_phase && ds.progress_phase !== 'context') badges += '<span class="badge warn">~</span>';

    div.innerHTML = `<span class="ds-name" title="${escHtml(ds.name)}">${escHtml(ds.name)}</span>${badges}`;
    div.onclick = () => selectDataset(ds.name);
    list.appendChild(div);
  }
}

function selectDataset(name) {
  selectedDs = name;
  document.getElementById('selected-label').textContent = name;
  renderDatasets();
  updateButtons();
  loadProgress();
  loadResults();
}

function updateButtons() {
  const has = !!selectedDs;
  const running = selectedDs && allDatasets.find(d => d.name === selectedDs)?.running;
  document.getElementById('btn-run').disabled = !has || running;
  document.getElementById('btn-fresh').disabled = !has || running;
  document.getElementById('btn-pause').disabled = !has || !running;
  const hasProgress = selectedDs && allDatasets.find(d => d.name === selectedDs)?.progress_phase;
  document.getElementById('btn-resume').disabled = !has || running || !hasProgress;
}

// ── Run / Pause ───────────────────────────────────────────────────────────

async function startRun(fresh) {
  if (!selectedDs) return;
  clearLog();
  await fetch(`/api/run/${encodeURIComponent(selectedDs)}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({fresh_start: fresh}),
  });
  connectSSE();
  _running = true;
  updateButtons();
  switchTab('log');
}

async function startResume() {
  if (!selectedDs) return;
  clearLog();
  await fetch(`/api/resume/${encodeURIComponent(selectedDs)}`, {method: 'POST'});
  connectSSE();
  _running = true;
  updateButtons();
  switchTab('log');
}

async function doPause() {
  if (!selectedDs) return;
  await fetch(`/api/pause/${encodeURIComponent(selectedDs)}`, {method: 'POST'});
}

// ── SSE log ───────────────────────────────────────────────────────────────

function connectSSE() {
  if (sseSource) sseSource.close();
  sseSource = new EventSource(`/api/log/${encodeURIComponent(selectedDs)}`);
  sseSource.onmessage = (e) => {
    if (e.data === '__DONE__') {
      sseSource.close();
      sseSource = null;
      _running = false;
      loadDatasets();
      loadProgress();
      loadResults();
      return;
    }
    if (e.data === '[heartbeat]') return;
    appendLog(e.data.replace(/\\n/g, '\n'));
  };
  sseSource.onerror = () => {
    sseSource.close();
    sseSource = null;
    _running = false;
    loadDatasets();
  };
}

function clearLog() {
  document.getElementById('log-pane').innerHTML = '';
}

function appendLog(msg) {
  const pane = document.getElementById('log-pane');
  const div = document.createElement('div');
  div.className = 'log-line';
  if (msg.includes('[PASS]') || msg.includes('[OK]') || msg.includes('Complete')) div.classList.add('ok');
  else if (msg.includes('[FAIL]') || msg.includes('ERROR') || msg.includes('FAIL')) div.classList.add('err');
  else if (msg.includes('WARN') || msg.includes('WARNING') || msg.includes('Budget exhausted')) div.classList.add('warn');
  div.textContent = msg;
  pane.appendChild(div);
  pane.scrollTop = pane.scrollHeight;
}

// ── Progress ──────────────────────────────────────────────────────────────

const PHASES = ['context','ref_analysis','feasibility','pre_scan','task_synthesis','kernel_loop','scan','doc_write','done'];
const PHASE_LABELS = {
  context: 'Build Context',
  ref_analysis: 'Reference Analysis',
  feasibility: 'Feasibility Check',
  pre_scan: 'Pre-scan (Event IDs)',
  task_synthesis: 'Task Synthesis',
  kernel_loop: 'Kernel Build Loop',
  scan: 'Final Scan',
  doc_write: 'Write analysis.md',
  done: 'Done',
};

async function loadProgress() {
  if (!selectedDs) return;
  const r = await fetch(`/api/progress/${encodeURIComponent(selectedDs)}`);
  const p = await r.json();

  const pane = document.getElementById('progress-pane');
  const curPhase = p.phase || 'context';
  const status = p.status || '';
  const budgetUsed = p.budget_used || 0;
  const budgetTotal = p.budget?.total || 500;

  let html = `<div style="margin-bottom:10px;color:var(--text2)">
    Budget: ${budgetUsed} / ${budgetTotal} calls used
    ${status ? ` | Status: <span style="color:${status==='done'?'var(--ok)':status==='failed'?'var(--err)':'var(--warn)'}">${status}</span>` : ''}
  </div>`;

  const curIdx = PHASES.indexOf(curPhase);
  for (let i = 0; i < PHASES.length; i++) {
    const ph = PHASES[i];
    let dotClass = '';
    if (i < curIdx) dotClass = 'done';
    else if (i === curIdx) dotClass = status === 'failed' || status === 'error' ? 'fail' : 'active';
    html += `<div class="progress-row">
      <div class="phase-dot ${dotClass}"></div>
      <span style="color:${dotClass==='done'?'var(--ok)':dotClass==='active'?'var(--warn)':dotClass==='fail'?'var(--err)':'var(--text2)'}">${PHASE_LABELS[ph] || ph}</span>
    </div>`;
  }

  if (p.feasibility_reason && status === 'failed') {
    html += `<div style="margin-top:10px;color:var(--err);font-size:11px">Reason: ${escHtml(p.feasibility_reason)}</div>`;
  }
  pane.innerHTML = html;
}

// ── Results ───────────────────────────────────────────────────────────────

async function loadResults() {
  if (!selectedDs) return;
  const [kr, ar] = await Promise.all([
    fetch(`/api/kernel/${encodeURIComponent(selectedDs)}`).then(r => r.json()),
    fetch(`/api/analysis/${encodeURIComponent(selectedDs)}`).then(r => r.json()),
  ]);
  document.getElementById('kernel-content').textContent = kr.content || '(no kernel)';
  document.getElementById('analysis-content').textContent = ar.content || ar.error || '(not found)';
}

// ── Tabs ──────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['log','progress','result'][i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => {
    p.classList.toggle('active', p.id === `pane-${name}`);
  });
  if (name === 'progress') loadProgress();
  if (name === 'result') loadResults();
}

// ── Settings ──────────────────────────────────────────────────────────────

async function openSettings() {
  const r = await fetch('/api/config');
  const cfg = await r.json();
  document.getElementById('cfg-url').value = cfg.url || '';
  document.getElementById('cfg-key').value = '';  // never show key
  document.getElementById('cfg-model').value = cfg.model || '';
  document.getElementById('cfg-proxy').value = cfg.proxy || '';
  document.getElementById('cfg-python').value = cfg.python_env || '';
  document.getElementById('cfg-eegunity').value = cfg.eegunity_path || '';
  document.getElementById('cfg-roots').value = (cfg.dataset_roots || []).join('\n');
  document.getElementById('cfg-workers').value = cfg.num_workers || 2;
  document.getElementById('cfg-budget').value = cfg.budget || 500;
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

async function saveSettings() {
  const roots = document.getElementById('cfg-roots').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const body = {
    url: document.getElementById('cfg-url').value.trim(),
    model: document.getElementById('cfg-model').value.trim(),
    proxy: document.getElementById('cfg-proxy').value.trim(),
    python_env: document.getElementById('cfg-python').value.trim(),
    eegunity_path: document.getElementById('cfg-eegunity').value.trim(),
    dataset_roots: roots,
    num_workers: parseInt(document.getElementById('cfg-workers').value) || 2,
    budget: parseInt(document.getElementById('cfg-budget').value) || 500,
  };
  const keyVal = document.getElementById('cfg-key').value.trim();
  if (keyVal) body.key = keyVal;
  await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  closeSettings();
}

// ── Utils ─────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────

loadDatasets();
setInterval(loadDatasets, 5000);
</script>
</body>
</html>
