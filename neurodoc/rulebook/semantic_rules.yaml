# neurodoc - Semantic Rulebook
# Used by detect.py for batch checking of analysis.md and kernel files.
#
# Check types:
#   section_exists -- string presence check
#   pattern        -- regex match (violated=found, unless require_match:true -> violated=not found)
#   field_value    -- extract named field, check against allowed_values list
#   cross_check    -- custom Python function registered in detect.py (see function: key)
#
# --- HARD CONSTRAINTS (enforced in generate.py, not detectable by detect.py) ---
#
# HC-1  Data fields in File Scan Result (Event ID, Count, Info table values,
#       Kernel SHA256 fingerprint) must come from kernel scan program output;
#       LLM must not invent or alter these fields. Semantic fields (Event Type,
#       Meaning) are generated by LLM in an isolated inference step but must be
#       based on actual evidence from dataset files; fabrication is not allowed.
#
# HC-2  Event Meaning and Type inference must be based on actual evidence in the
#       dataset (events.tsv, sidecar JSON, README, etc.). LLM may consult any
#       context information, but must not use unrelated reference papers, domain
#       conventions, or BCI competition code systems as inference basis (e.g.,
#       must not infer four motor-imagery classes solely because event IDs are
#       1-4). Once an inference result is fixed it becomes a locked value;
#       downstream pipeline must not modify it.
#
# HC-3  Meta Area fields (Channels, Sampling Rate) should be cross-referenced
#       against the locator cache CSV. LLM may fill narrative gaps but must
#       not override program-derived values.
#
# HC-4  LLM or automation may only set Status to:
#         wait_manual_review  -- default output when no explicit structural kernel gap is exposed
#         wait_kernel_update  -- explicit structural kernel gap or scan failure
#       "completed" and "hallucination" are reserved for human reviewers only.
#
# HC-5  Kernel must NOT remap original event IDs. Prefix-based enrichment is
#       allowed (e.g., subject_attr-event_id, session_attr-event_id).
#       Original event IDs must pass through unchanged.
#
# HC-6  Kernel channel remapping is only allowed when explicit evidence exists
#       in the dataset directory (companion file, README, sidecar) mapping
#       ambiguous/numeric channels to named channels. Add a comment in kernel
#       citing the evidence file.
#
# HC-7  Full scan count should be minimized to avoid re-scanning the same
#       dataset. The pipeline should run a consistency check before final
#       output to ensure document content matches scan results.
# ---------------------------------------------------------------------------

rules:
  # --- Group A: Document Structure -------------------------------------------
  # Aligns with neuroaudit/template_spec.py. Violations here will also fail
  # template_checker.py when the document is viewed in NeuroAudit.

  - id: "has_paradigm"
    desc: "analysis.md must contain ## Paradigm section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Paradigm"
    severity: "error"

  - id: "has_file_scan_result"
    desc: "analysis.md must contain ## File Scan Result section."
    target: "analysis_md"
    check: "section_exists"
    section: "## File Scan Result"
    severity: "error"

  - id: "has_tasks"
    desc: "analysis.md must contain ## Tasks section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Tasks"
    severity: "error"

  - id: "has_data_quality_notes"
    desc: "analysis.md must contain ## Data Quality Notes section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Data Quality Notes"
    severity: "error"

  - id: "has_kernel_responsibilities"
    desc: "analysis.md must contain ## Kernel Responsibilities section."
    target: "analysis_md"
    check: "section_exists"
    section: "## Kernel Responsibilities"
    severity: "error"

  - id: "has_event_structure"
    desc: "## File Scan Result must contain ### Event Structure subsection."
    target: "analysis_md"
    check: "section_exists"
    section: "### Event Structure"
    severity: "error"

  - id: "has_info_subsection"
    desc: "## File Scan Result must contain ### Info subsection (rulebook Article 57.1)."
    target: "analysis_md"
    check: "section_exists"
    section: "### Info"
    severity: "error"

  - id: "no_stim_label_summary"
    desc: "STIM Label Summary is a deprecated legacy section and must not appear."
    target: "analysis_md"
    check: "pattern"
    pattern: "^##\\s+STIM Label Summary"
    severity: "error"

  - id: "section_order_correct"
    desc: "Top-level sections must follow order: Paradigm -> File Scan Result -> Tasks -> Data Quality Notes -> Kernel Responsibilities."
    target: "analysis_md"
    check: "cross_check"
    function: "section_order"
    severity: "error"

  - id: "no_extra_top_level_sections"
    desc: "Only the 5 required ## sections are allowed. No extra top-level headings (rulebook Article 30.2)."
    target: "analysis_md"
    check: "cross_check"
    function: "no_extra_sections"
    severity: "error"

  # --- Group B: Field Legal Values -------------------------------------------
  # Aligns with neuroaudit/rulebook.md explicit enumeration rules.

  - id: "status_valid_value"
    desc: "Status must be one of: wait_kernel_update, wait_manual_review, completed, hallucination (rulebook Article 42.2)."
    target: "analysis_md"
    check: "field_value"
    field_pattern: ">\\s*\\*\\*Status\\*\\*:\\s*(.+)"
    allowed_values:
      - "wait_kernel_update"
      - "wait_manual_review"
      - "completed"
      - "hallucination"
    severity: "error"

  - id: "super_meta_required_valid_value"
    desc: "Super Meta Required must be exactly 'Yes' or 'No' (rulebook Article 37)."
    target: "analysis_md"
    check: "field_value"
    field_pattern: ">\\s*\\*\\*Super Meta Required\\*\\*:\\s*(.+)"
    allowed_values:
      - "Yes"
      - "No"
    severity: "error"

  - id: "category_valid_value"
    desc: "Category must be one of 6 valid values (rulebook Article 25): Complex Applied / High-level Mental / Action/Output / Sensory/Response / Biological State / Others."
    target: "analysis_md"
    check: "field_value"
    field_pattern: "\\*\\*Category\\*\\*:\\s*([^|\\n]+)"
    allowed_values:
      - "Complex Applied"
      - "High-level Mental"
      - "Action/Output"
      - "Sensory/Response"
      - "Biological State"
      - "Others"
    severity: "error"

  - id: "label_route_no_deprecated"
    desc: "Label Route must use current values event, misc, or info. Historical values Annotation/STIM/MISC are not allowed (rulebook Article 77)."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\*\\*Label Route\\*\\*[^\\n]*`(Annotation|STIM|MISC)`"
    case_sensitive: true
    severity: "error"

  - id: "event_type_no_deprecated"
    desc: "Event Structure Type must use event or admin only. Historical short/long/rest values are not allowed (rulebook Article 46)."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\|\\s*(short|long|rest)\\s*\\|"
    severity: "error"

  - id: "kernel_fingerprint_exists"
    desc: "## File Scan Result must begin with a kernel fingerprint blockquote containing Kernel SHA256 (rulebook Article 42.5)."
    target: "analysis_md"
    check: "pattern"
    pattern: ">\\s*\\*\\*Kernel SHA256\\*\\*:"
    require_match: true
    severity: "error"

  - id: "no_placeholder_doi"
    desc: "Evidence DOIs must not be placeholder strings (TODO / N/A / none / unknown / placeholder)."
    target: "analysis_md"
    check: "pattern"
    pattern: "DOI.*`(TODO|N/A|none|unknown|placeholder)`"
    severity: "warning"

  # --- Group C: Semantic Consistency -----------------------------------------

  - id: "super_meta_matches_tasks"
    desc: "Super Meta Required must match actual Meta Level in Tasks: Yes if any task has Meta Level=super, No if all raw (rulebook Article 37-38)."
    target: "analysis_md"
    check: "cross_check"
    function: "super_meta_consistency"
    severity: "error"

  - id: "target_events_in_event_structure"
    desc: "All event IDs referenced in Tasks Target Definition tables must appear in ### Event Structure."
    target: "analysis_md"
    check: "cross_check"
    function: "target_events_exist"
    severity: "error"

  - id: "classical_task_has_evidence"
    desc: "Every Classical Task must have a non-empty Evidence field (rulebook Articles 62 and 79)."
    target: "analysis_md"
    check: "cross_check"
    function: "classical_task_evidence"
    severity: "error"

  - id: "info_completeness_valid"
    desc: "### Info table Completeness column must use: complete, partial (x/n), incomplete, or missing (rulebook Article 57.3)."
    target: "analysis_md"
    check: "cross_check"
    function: "info_completeness_values"
    severity: "error"

  - id: "kernel_sha256_matches_file"
    desc: "If Kernel SHA256 is a concrete hash, it must match the effective kernel file used for scanning. `N/A` is allowed when scanning does not require a dataset-specific kernel file (for example generic/default parser cases)."
    target: "analysis_md"
    check: "cross_check"
    function: "kernel_sha256_matches"
    severity: "error"

  - id: "no_auto_removed_tasks"
    desc: "Tasks section must not contain [AUTO-REMOVED] blocks. These indicate guard-removed hallucinations; dataset needs regeneration."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\[AUTO-REMOVED\\]"
    severity: "warning"

  - id: "no_mi_label_on_phase_marker"
    desc: "Event Structure must not assign MI class labels to events whose Meaning is a trial phase marker (rest/ready/task/interval). See HC-2."
    target: "analysis_md"
    check: "cross_check"
    function: "no_mi_on_phase_markers"
    severity: "error"

  - id: "no_hallucinated_bcic_classes"
    desc: "Must not assign BCIC IV 2a class codes (769/770/771/772) as event labels without explicit sidecar evidence."
    target: "analysis_md"
    check: "pattern"
    pattern: "\\b(769|770|771|772)\\b.*class"
    severity: "warning"

  - id: "kr_has_super_meta"
    desc: "## Kernel Responsibilities must contain > **Super Meta Required**: blockquote field (rulebook Articles 36-38)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_has_super_meta"
    severity: "error"

  - id: "kr_has_status"
    desc: "## Kernel Responsibilities must contain > **Status**: blockquote field (rulebook Articles 36 and 42.1)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_has_status"
    severity: "error"

  - id: "kr_only_blockquote_fields"
    desc: "## Kernel Responsibilities must contain only the two blockquote fields (Super Meta Required, Status), no extra prose (rulebook Articles 36 and 42.4)."
    target: "analysis_md"
    check: "cross_check"
    function: "kr_only_blockquote_fields"
    severity: "warning"

  - id: "dqn_bullet_format"
    desc: "## Data Quality Notes content must use '- ' bullet format (rulebook Article 83)."
    target: "analysis_md"
    check: "cross_check"
    function: "dqn_bullet_format"
    severity: "warning"

  - id: "task_type_no_normal"
    desc: "Task headings must be 'Classical Task' or 'Potential Task' only. 'Normal Task' is a legacy label and is not allowed."
    target: "analysis_md"
    check: "pattern"
    pattern: "###\\s+Normal\\s+Task"
    severity: "error"

  - id: "task_order_classical_first"
    desc: "All Classical Tasks must appear before all Potential Tasks in ## Tasks section."
    target: "analysis_md"
    check: "cross_check"
    function: "task_order_classical_first"
    severity: "error"

  - id: "task_numbering_from_one"
    desc: "Task numbering must start from 1 within each type and increase consecutively."
    target: "analysis_md"
    check: "cross_check"
    function: "task_numbering_from_one"
    severity: "error"

  # Task taxonomy and route/epoch consistency.
  - id: "task_dataset_dispatchable"
    desc: "Every Task block must be accepted by dataset_api.build_dataset_from_task(dry_run=True)."
    target: "analysis_md"
    check: "cross_check"
    function: "task_dataset_dispatchable"
    severity: "error"

  - id: "target_def_schema_matches_route"
    desc: "Target Definition table header must match the Label Route x Task Type matrix (rulebook Article 77.4)."
    target: "analysis_md"
    check: "cross_check"
    function: "target_def_schema_matches_route"
    severity: "error"

  - id: "single_target_per_task"
    desc: "For misc/info tasks, the first Target Definition column must contain exactly one unique source value. This rule does not restrict event tasks with multiple Event ID rows (rulebook Articles 77.3 and 77.5)."
    target: "analysis_md"
    check: "cross_check"
    function: "single_target_per_task"
    severity: "error"

  - id: "classification_task_has_multiple_classes"
    desc: "Classification tasks must have >= 2 distinct y values in Target Definition (rulebook Article 77.7)."
    target: "analysis_md"
    check: "cross_check"
    function: "classification_task_has_multiple_classes"
    severity: "error"

  - id: "classification_y_zero_indexed_sequential"
    desc: "Event-route classification tasks must use 0-based sequential integer y values: the distinct y set must equal set(range(N)). Many-to-one mapping is allowed (e.g. A->0, B->1, C->1 is valid; {0,1,3} or {1,2} are not). Misc/info routes use Y Mapping Notes instead of a y column."
    target: "analysis_md"
    check: "cross_check"
    function: "classification_y_zero_indexed_sequential"
    severity: "error"

  - id: "derived_misc_requires_super_meta"
    desc: "Tasks with Label Route = misc whose Target Definition source is not listed as native in MISC Label Summary must have Meta Level = super (rulebook Article 77.8)."
    target: "analysis_md"
    check: "cross_check"
    function: "derived_misc_requires_super_meta"
    severity: "error"

  - id: "segmentation_requires_empty_target_events"
    desc: "Epoch Method = epoch_by_segmentation_hdf5 requires target_events = [] (rulebook Articles 45 and 72)."
    target: "analysis_md"
    check: "cross_check"
    function: "segmentation_requires_empty_target_events"
    severity: "error"

  - id: "epoch_parameters_complete"
    desc: "Epoch Parameters must list the minimum required keys for the declared Epoch Method (rulebook Articles 69-72)."
    target: "analysis_md"
    check: "cross_check"
    function: "epoch_parameters_complete"
    severity: "error"

  - id: "manual_review_blank"
    desc: "Completed documents must record at least one reviewer name. `wait_manual_review` documents may be blank or may retain reviewer names from later manual rework."
    target: "analysis_md"
    check: "cross_check"
    function: "completed_manual_review_required"
    severity: "warning"

  # --- Group D: Kernel Code Constraints --------------------------------------
  # HC-5 reference: no event remapping; prefix enrichment allowed.
  # Kernel safety: no destructive file operations, no shell calls.

  - id: "kernel_has_kernel_id"
    desc: "Every kernel file must define KERNEL_ID."
    target: "kernel"
    check: "pattern"
    pattern: "KERNEL_ID[^=]*="
    require_match: true
    severity: "error"

  - id: "kernel_has_apply"
    desc: "Every kernel file must implement apply()."
    target: "kernel"
    check: "pattern"
    pattern: "def apply"
    require_match: true
    severity: "error"

  - id: "kernel_no_shell_commands"
    desc: "Kernel must not use os.system, subprocess.call, or shell=True."
    target: "kernel"
    check: "pattern"
    pattern: "(os\\.system|subprocess\\.call|shell\\s*=\\s*True)"
    severity: "error"

  - id: "kernel_no_file_writes"
    desc: "Kernel must not write or delete files."
    target: "kernel"
    check: "pattern"
    pattern: "(open\\(.*['\"]w['\"]|os\\.remove|shutil\\.rmtree|Path.*\\.write_text)"
    severity: "error"

  - id: "kernel_no_event_remapping"
    desc: "Kernel must not hard-remap original event IDs. Prefix enrichment (attr-event_id) is allowed; replacing/renaming event IDs is not (HC-5)."
    target: "kernel"
    check: "pattern"
    pattern: "(event_id_map\\s*=|rename_events\\s*=|replace_events\\s*=|\\.rename\\s*\\(.*[\"']event)"
    severity: "warning"
